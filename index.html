<style>
:root{--bg:#f2f4f7;--card:#fff;--text:#111;--muted:#6b7280;--accent:#0b6e99;--green:#16a34a;--orange:#ea8a0c;--red:#dc2626;--line:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1b1e24;--text:#f3f4f6;--muted:#9ca3af;--line:#2a2e36}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}
header{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;flex:1}
.iconbtn{border:0;background:none;color:var(--accent);font-size:20px;padding:6px 8px;cursor:pointer}
.langbtn{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:999px;padding:4px 12px;font-weight:600}
main{position:fixed;top:calc(env(safe-area-inset-top) + 50px);bottom:calc(env(safe-area-inset-bottom) + 58px);left:0;right:0}
.view{position:absolute;inset:0;overflow-y:auto;display:none;padding:12px}
.view.active{display:block}
#view-map{padding:0}
#map{position:absolute;inset:0}
nav{position:fixed;bottom:0;left:0;right:0;z-index:1000;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:8px 0 6px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:21px}
nav button.active{color:var(--accent)}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.sub{font-size:13px;color:var(--muted)}
.badge{font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.g{color:var(--green);background:#16a34a22}.o{color:var(--orange);background:#ea8a0c22}.r{color:var(--red);background:#dc262622}.n{color:var(--muted);background:#8882}
.pin{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px #0006;display:flex;align-items:center;justify-content:center;font-size:16px;position:relative}
.pin b{position:absolute;top:-9px;right:-12px;background:#fff;color:#000;font-size:10px;padding:0 4px;border-radius:8px;box-shadow:0 1px 2px #0004}
.legend{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:500;background:var(--card);border-radius:999px;padding:6px 14px;font-size:12px;display:flex;gap:12px;box-shadow:0 2px 8px #0003;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:4px;vertical-align:middle}
.fab{position:absolute;z-index:500;right:12px;width:46px;height:46px;border-radius:50%;border:0;background:var(--card);color:var(--accent);font-size:22px;box-shadow:0 2px 8px #0004}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:600;font-size:44px;color:var(--accent);pointer-events:none;display:none}
#addbar{position:absolute;left:12px;right:12px;bottom:12px;z-index:600;display:none}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:12px;font-size:16px;font-weight:600;background:var(--accent);color:#fff;text-align:center;text-decoration:none;cursor:pointer}
.btn.sec{background:#0b6e9922;color:var(--accent)}.btn.del{background:#dc262622;color:var(--red)}
.sheet{position:fixed;inset:0;z-index:2000;background:var(--bg);overflow-y:auto;display:none;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 16px)}
.sheet.open{display:block}
.sheethead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sheethead h2{flex:1;margin:0;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{text-align:center;padding:8px 2px;border-radius:10px;background:var(--bg)}
.cell .ic{font-size:18px}.cell .v{font-weight:700;font-size:14px}.cell .l{font-size:11px;color:var(--muted)}
.score{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.ring{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
.fac{padding:4px 0;font-size:14px}
.danger{background:#dc262622;color:var(--red);font-weight:600}
details{border-bottom:1px solid var(--line);padding:10px 0}details:last-child{border:0}
summary{font-weight:600;cursor:pointer}
details p{margin:8px 0 0;font-size:14px}
label.f{display:block;margin:10px 0 4px;font-size:13px;color:var(--muted)}
input[type=text],select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
svg text{fill:var(--muted);font-size:10px}
.leaflet-container{font:inherit}
[dir=rtl] .fab{right:auto;left:12px}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:6px}
.sprow{display:flex;align-items:center;gap:10px;padding:7px 0}
.sprow .nm{width:42%;font-size:14px}
.sprow .pc{width:44px;text-align:end;font-weight:700;font-size:14px}
.big{font-size:34px;font-weight:800;line-height:1}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg);margin:2px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
.tbl th,.tbl td{padding:6px 6px;text-align:center;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-weight:600;font-size:11px}
.seastate{font-size:18px;font-weight:700;margin-bottom:8px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}.kv span:first-child{color:var(--muted)}
</style>
</head>

// ================= Météo & mer (Open-Meteo) =================
const forecasts = {};
const loading = new Set();
const errors = {};
const MARINE_VARS = 'wave_height,wave_direction,wave_period,wind_wave_height,wind_wave_direction,wind_wave_period,swell_wave_height,swell_wave_direction,swell_wave_period,sea_surface_temperature,ocean_current_velocity,ocean_current_direction,sea_level_height_msl';

function parseLocal(str, offset) {
  const [d, tm] = str.split('T'); const [y, m, dd] = d.split('-').map(Number); const [hh, mi] = tm.split(':').map(Number);
  return new Date(Date.UTC(y, m - 1, dd, hh, mi) - offset * 1000);
}
const getJSON = url => fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });

async function fetchMarine(lat, lon) {
  const m = await getJSON(`https://marine-api.open-meteo.com/v1/marine?latitude=${lat.toFixed(3)}&longitude=${lon.toFixed(3)}&timezone=auto&past_days=1&forecast_days=3&hourly=${MARINE_VARS}`);
  const ok = m.hourly && (m.hourly.wave_height || []).some(v => v != null);
  return ok ? m : null;
}

async function fetchSpot(s) {
  const fUrl = `https://api.open-meteo.com/v1/forecast?latitude=${s.lat.toFixed(4)}&longitude=${s.lon.toFixed(4)}&timezone=auto&past_days=1&forecast_days=3&wind_speed_unit=kmh&daily=sunrise,sunset&hourly=temperature_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m,precipitation_probability,precipitation,pressure_msl,cloud_cover,visibility`;
  const fP = getJSON(fUrl);
  // point marin : celui du spot, sinon on décale vers le large
  const candidates = s.sea ? [s.sea] : [[s.lat, s.lon], s.coast === 'atlantic' ? [s.lat, s.lon - 0.05] : [s.lat + 0.03, s.lon], [s.lat, s.lon - 0.1]];
  let marine = null;
  for (const [la, lo] of candidates) { try { marine = await fetchMarine(la, lo); } catch (e) {} if (marine) break; }
  const f = await fP;
  const off = f.utc_offset_seconds || 0, H = f.hourly;
  const mar = {};
  if (marine) {
    const M = marine.hourly, g = (k, i) => (M[k] ? M[k][i] : null) ?? null;
    M.time.forEach((tm, i) => mar[tm] = {
      wave: g('wave_height', i), wdir: g('wave_direction', i), wper: g('wave_period', i),
      wwH: g('wind_wave_height', i), wwDir: g('wind_wave_direction', i), wwPer: g('wind_wave_period', i),
      swH: g('swell_wave_height', i), swDir: g('swell_wave_direction', i), swPer: g('swell_wave_period', i),
      sea: g('sea_surface_temperature', i), cur: g('ocean_current_velocity', i), curDir: g('ocean_current_direction', i),
      sl: g('sea_level_height_msl', i)});
  }
  const hours = H.time.map((tm, i) => Object.assign({
    date: parseLocal(tm, off), temp: H.temperature_2m[i], wind: H.wind_speed_10m[i], dir: H.wind_direction_10m[i], gust: H.wind_gusts_10m[i],
    pprob: H.precipitation_probability[i], precip: H.precipitation[i], pres: H.pressure_msl[i], cloud: H.cloud_cover[i], vis: H.visibility ? H.visibility[i] : null,
  }, mar[tm] || {}));
  const sun = f.daily.sunrise.map((r, i) => ({rise: parseLocal(r, off), set: parseLocal(f.daily.sunset[i], off)}));
  // pluie cumulée sur 24 h (pour la clarté de l'eau)
  hours.forEach((h, i) => { let s24 = 0; for (let k = Math.max(0, i - 23); k <= i; k++) s24 += hours[k].precip || 0; h.rain24 = s24; });
  const tide = analyzeTide(hours);
  return {hours, sun, tide, hasMarine: !!marine};
}

async function loadSpot(s, force = false) {
  const ex = forecasts[s.id];
  if (!force && ex && Date.now() - ex.fetchedAt < 30 * 60 * 1000) return;
  if (loading.has(s.id)) return;
  loading.add(s.id); updateLoading();
  try {
    const d = await fetchSpot(s);
    forecasts[s.id] = {fetchedAt: Date.now(), hours: scoreHours(d.hours, d.sun, s), sun: d.sun, tide: d.tide, hasMarine: d.hasMarine};
    delete errors[s.id];
  } catch (e) { errors[s.id] = true; }
  loading.delete(s.id); updateLoading();
  refreshAll();
}
const loadAll = (force = false) => Promise.all(allSpots().map(s => loadSpot(s, force)));
function updateLoading() { document.getElementById('refresh').textContent = loading.size ? '⏳' : '↻'; }

// ================= Marée (depuis la hauteur d'eau modélisée) =================
function analyzeTide(hours) {
  const raw = [];
  for (let i = 1; i < hours.length - 1; i++) {
    const a = hours[i - 1].sl, b = hours[i].sl, c = hours[i + 1].sl;
    if (a == null || b == null || c == null) continue;
    if (b > a && b >= c) raw.push({type: 'high', date: hours[i].date, h: b});
    else if (b < a && b <= c) raw.push({type: 'low', date: hours[i].date, h: b});
  }
  const ext = [];
  for (const e of raw) {
    const last = ext[ext.length - 1];
    if (last && last.type === e.type) { if ((e.type === 'high') === (e.h > last.h)) ext[ext.length - 1] = e; continue; }
    if (last && Math.abs(e.h - last.h) < 0.04) continue;
    ext.push(e);
  }
  const ranges = []; for (let k = 1; k < ext.length; k++) ranges.push(Math.abs(ext[k].h - ext[k - 1].h));
  const med = ranges.length ? ranges.slice().sort((a, b) => a - b)[Math.floor(ranges.length / 2)] : 0;
  hours.forEach(h => {
    let prev = null; for (const e of ext) if (e.date <= h.date) prev = e;
    const next = ext.find(e => e.date > h.date);
    if (!prev || !next) { h.tide = null; return; }
    const frac = (h.date - prev.date) / (next.date - prev.date), range = Math.abs(next.h - prev.h);
    h.tide = {rising: next.type === 'high', frac, range, slack: frac < 0.12 || frac > 0.88, big: med > 0 && range > med * 1.15};
  });
  return {extremes: ext, medianRange: med, available: ext.length >= 2};
}

// ================= Indice & probabilités =================
const inRange = (d, a, b) => d >= a && d <= b;
function timeOfDay(date, sun) {
  for (const s of sun) if (Math.abs(date - s.rise) <= 5400e3 || Math.abs(date - s.set) <= 5400e3) return 'dawnDusk';
  for (const s of sun) if (date > s.rise && date < s.set) return 'day';
  return 'night';
}
function clarityOf(h) {
  if ((h.rain24 || 0) > 10 || (h.wave || 0) > 2.2) return 'turbid';
  if ((h.rain24 || 0) > 3 || (h.wave || 0) > 1.2) return 'slight';
  return 'clear';
}
function douglas(w) {
  if (w == null) return null;
  return w < 0.05 ? 0 : w < 0.1 ? 1 : w < 0.5 ? 2 : w < 1.25 ? 3 : w < 2.5 ? 4 : w < 4 ? 5 : w < 6 ? 6 : 7;
}
function waveFit(p, w) { if (w == null) return .8; if (w > 2.5) return .1; if (w < p.wave[0]) return p.calmFit; if (w <= p.wave[1]) return 1; return p.roughFit; }
function tempFit(p, x) { if (x == null) return .85; if (x >= p.temp[0] && x <= p.temp[1]) return 1; const d = x < p.temp[0] ? p.temp[0] - x : x - p.temp[1]; return Math.max(.3, 1 - d * .12); }

function scoreHours(hours, sun, spot) {
  const out = hours.map((h, i) => {
    let s = 50; const f = []; const add = (v, key, pos) => { s += v; f.push({key, pos}); };
    if (h.wind != null) {
      if (h.wind < 10) add(15, 'f.wind.calm', 1); else if (h.wind < 20) add(8, 'f.wind.light', 1);
      else if (h.wind < 30) add(-5, 'f.wind.moderate', 0); else if (h.wind < 40) add(-20, 'f.wind.strong', 0); else add(-40, 'f.wind.veryStrong', 0);
    }
    if (h.gust != null && h.gust > 50) add(-15, 'f.gusts', 0);
    if (h.wind != null && h.dir != null && h.wind >= 20) {
      const east = inRange(h.dir, 45, 135), west = inRange(h.dir, 225, 315);
      if (east && spot.coast === 'mediterranean') add(-10, 'f.chergui.exposed', 0);
      if (west && spot.coast === 'atlantic') add(-10, 'f.gharbi.exposed', 0);
      if ((east && spot.coast === 'atlantic') || (west && spot.coast === 'mediterranean')) add(5, 'f.wind.sheltered', 1);
    }
    if (h.wave != null) {
      if (h.wave > 2.5) add(-30, 'f.waves.danger', 0); else if (h.wave >= 1.5) add(-5, 'f.waves.rough', 0);
      else if (h.wave >= 0.5) add(spot.type === 'jetty' ? 5 : 15, 'f.waves.ideal', 1); else add(5, 'f.waves.calm', 1);
    }
    if (h.swPer != null && h.swH != null && h.swPer > 12 && h.swH > 1) add(-5, 'f.swell.long', 0);
    if (h.cur != null && h.cur > 3) add(-5, 'f.current.strong', 0);
    const clar = clarityOf(h);
    if (clar === 'turbid') add(-5, 'f.clarity.turbid', 0);
    if (i >= 3 && h.pres != null && hours[i - 3].pres != null) {
      const d = h.pres - hours[i - 3].pres;
      if (d <= -0.5 && d >= -3) add(10, 'f.pressure.falling', 1); else if (d < -3) add(-5, 'f.pressure.dropFast', 0);
      else if (d > 2) add(-5, 'f.pressure.rising', 0); else add(3, 'f.pressure.stable', 1);
    }
    const tod = timeOfDay(h.date, sun);
    if (tod === 'dawnDusk') add(15, 'f.light.golden', 1);
    else if (tod === 'night') add(3, 'f.light.night', 1);
    else if (h.cloud != null && h.cloud > 60) add(5, 'f.cloudy', 1);
    else if ((h.cloud ?? 0) < 30) add(-5, 'f.light.harsh', 0);
    if (h.precip != null) { if (h.precip > 2) add(-10, 'f.rain.heavy', 0); else if (h.precip > 0.1) add(2, 'f.rain.light', 1); }
    if (h.tide) {
      if (h.tide.slack) add(-3, 'f.tide.slack', 0);
      else if (inRange(h.tide.frac, 0.2, 0.8)) add(8, 'f.tide.moving', 1);
      if (h.tide.rising && !h.tide.slack && (spot.type === 'rocks' || spot.type === 'estuary')) add(4, 'f.tide.rising', 1);
      if (h.tide.big) add(4, 'f.tide.big', 1);
    } else {
      const ill = moonIllum(h.date); if (ill < 0.1 || ill > 0.9) add(5, 'f.moon.spring', 1);
    }
    const dangerous = (h.wave ?? 0) > 2.5 || (h.gust ?? 0) > 60 || (spot.type === 'rocks' && (h.swH ?? 0) > 2 && (h.swPer ?? 0) > 12);
    let score = Math.round(Math.max(0, Math.min(100, s))); if (dangerous) score = Math.min(score, 20);
    return {c: h, score, factors: f, dangerous, tod, clarity: clar};
  });
  // indices par espèce puis probabilité sur une session de 2 h
  const idx = out.map(h => {
    const r = {};
    for (const sp of SPECIES) {
      const p = SP[sp], c = h.c;
      let v = p.base * p.season[c.date.getMonth()] * p.light[h.tod] * waveFit(p, c.wave) * p.clarity[h.clarity] * tempFit(p, c.sea) * (p.type[spot.type] || .7);
      if (c.tide && !c.tide.slack) v *= c.tide.rising ? p.tideRising : 1.03;
      if (c.tide && c.tide.slack) v *= 0.85;
      v *= 0.4 + 0.9 * (h.score / 100);
      r[sp] = h.dangerous ? 0 : Math.min(1.2, v);
    }
    return r;
  });
  const species = spotSpecies(spot);
  out.forEach((h, i) => {
    const nxt = idx[i + 1] || idx[i];
    h.chances = {};
    for (const sp of SPECIES) h.chances[sp] = 1 - Math.exp(-1.6 * (idx[i][sp] + nxt[sp]) / 2);
    const miss = species.reduce((acc, sp) => acc * (1 - h.chances[sp]), 1);
    h.total = h.dangerous ? 0 : Math.min(0.95, (1 - miss) * 0.85);
  });
  return out;
}

const THRESHOLD = 65;
function windows(hours, within = 72) {
  const now = Date.now(), res = []; let cur = [];
  const flush = () => { if (!cur.length) return; const sc = cur.map(x => x.score), pr = cur.map(x => x.total);
    res.push({start: cur[0].c.date, end: new Date(+cur[cur.length - 1].c.date + 3600e3), avg: Math.round(sc.reduce((a, b) => a + b, 0) / sc.length), chance: Math.max(...pr)}); cur = []; };
  for (const h of hours) {
    if (h.c.date < now - 3600e3 || h.c.date > now + within * 3600e3) continue;
    if (h.score >= THRESHOLD && !h.dangerous) cur.push(h); else flush();
  }
  flush();
  return res.sort((a, b) => b.chance - a.chance || b.avg - a.avg);
}
const futureHours = (s, within = 48) => (forecasts[s.id]?.hours || []).filter(h => +h.c.date + 3600e3 > Date.now() && +h.c.date < Date.now() + within * 3600e3);
const currentHour = s => futureHours(s, 72)[0];
const bestHour = (hours, get) => hours.reduce((b, h) => (!b || get(h) > get(b)) ? h : b, null);

function contextTips(h, spot) {
  const out = [], c = h.c, has = k => h.factors.some(f => f.key === k);
  if (h.dangerous) out.push('ctx.danger');
  if (c.wind >= 30) out.push('ctx.wind.strong');
  if (c.wind >= 20 && c.dir != null) { if (inRange(c.dir, 45, 135)) out.push('ctx.chergui'); else if (inRange(c.dir, 225, 315)) out.push('ctx.gharbi'); }
  if (c.wave != null && !h.dangerous) { if (c.wave >= 0.5 && c.wave < 1.5) out.push('ctx.waves.ideal'); else if (c.wave < 0.5) out.push('ctx.waves.calm'); }
  if (has('f.swell.long')) out.push('ctx.swell.long');
  if (has('f.current.strong')) out.push('ctx.current');
  if (c.tide && c.tide.slack) out.push('ctx.tide.slack'); else if (c.tide && c.tide.rising) out.push('ctx.tide.rising');
  if (h.clarity === 'turbid') out.push('ctx.turbid');
  if (has('f.pressure.falling')) out.push('ctx.pressure.falling');
  if (has('f.light.golden')) out.push('ctx.golden');
  if (h.tod === 'night' && spotSpecies(spot).includes('squid')) out.push('ctx.night');
  if (has('f.cloudy')) out.push('ctx.cloudy');
  if (has('f.light.harsh')) out.push('ctx.sunny');
  if (c.sea != null && c.sea < 15) out.push('ctx.coldWater');
  if (!out.length) out.push('ctx.default');
  return out;
}

// ================= Lune =================
const SYN = 29.530588853, REF = Date.UTC(2000, 0, 6, 18, 14);
function moonPhase(d) { let p = ((d - REF) / 864e5 % SYN) / SYN; return p < 0 ? p + 1 : p; }
function moonIllum(d) { return (1 - Math.cos(2 * Math.PI * moonPhase(d))) / 2; }
function moonInfo(d) {
  const p = moonPhase(d);
  const tab = [[0.03,'moon.new','🌑'],[0.22,'moon.waxingCrescent','🌒'],[0.28,'moon.firstQuarter','🌓'],[0.47,'moon.waxingGibbous','🌔'],[0.53,'moon.full','🌕'],[0.72,'moon.waningGibbous','🌖'],[0.78,'moon.lastQuarter','🌗'],[0.97,'moon.waningCrescent','🌘'],[1.01,'moon.new','🌑']];
  const e = tab.find(x => p < x[0]); return {key: e[1], icon: e[2]};
}

// ================= Formatage =================
const loc = () => lang === 'ar' ? 'ar-MA' : 'fr-FR';
const fmtTime = d => d.toLocaleTimeString(loc(), {hour: '2-digit', minute: '2-digit', hour12: false});
function fmtDay(d) {
  const a = new Date(); a.setHours(0, 0, 0, 0); const b = new Date(d); b.setHours(0, 0, 0, 0);
  const diff = Math.round((b - a) / 864e5);
  if (diff === 0) return t('day.today'); if (diff === 1) return t('day.tomorrow');
  return d.toLocaleDateString(loc(), {weekday: 'long', day: 'numeric', month: 'short'});
}
const fmtRange = w => `${fmtDay(w.start)} · ${fmtTime(w.start)} – ${fmtTime(w.end)}`;
const fmtAt = d => `${fmtDay(d)} · ${fmtTime(d)}`;
const num = (v, u, dg = 0) => v == null ? '—' : `${(+v).toFixed(dg)} ${u}`;
const cardinal = d => d == null ? '' : t('dir.' + ['N','NE','E','SE','S','SW','W','NW'][Math.round(((d % 360) / 45)) % 8]);
const arrow = d => d == null ? '' : `<span style="display:inline-block;transform:rotate(${d}deg)">⬇︎</span>`;
const pct = p => `${Math.round(p * 100)} %`;
const pcol = p => p == null ? '#9ca3af' : p >= 0.6 ? '#16a34a' : p >= 0.35 ? '#ea8a0c' : '#dc2626';
const pcls = p => p == null ? 'n' : p >= 0.6 ? 'g' : p >= 0.35 ? 'o' : 'r';
const cls = s => s == null ? 'n' : s >= 65 ? 'g' : s >= 45 ? 'o' : 'r';
const color = s => s == null ? '#9ca3af' : s >= 65 ? '#16a34a' : s >= 45 ? '#ea8a0c' : '#dc2626';
const labelKey = s => s >= 65 ? 'score.good' : s >= 45 ? 'score.medium' : 'score.bad';
const badge = s => `<span class="badge ${cls(s)}">${s}/100</span>`;
const pbadge = p => `<span class="badge ${pcls(p)}">🎣 ${pct(p)}</span>`;

// ================= Graphiques SVG =================
function lineChart(hours, series, opts = {}) {
  const W = 340, Hh = opts.h || 140, pad = 26, n = hours.length; if (n < 2) return '';
  const x0 = +hours[0].c.date, x1 = +hours[n - 1].c.date, X = d => pad + (W - pad - 6) * (d - x0) / (x1 - x0);
  const lo = opts.min ?? 0, hi = opts.max ?? 100, Y = v => 8 + (Hh - 30) * (1 - (v - lo) / (hi - lo || 1));
  let g = '';
  hours.forEach(h => { if (h.c.date.getHours() === 0) g += `<line x1="${X(+h.c.date)}" x2="${X(+h.c.date)}" y1="8" y2="${Hh - 22}" stroke="#8884"/><text x="${X(+h.c.date) + 3}" y="${Hh - 8}">${h.c.date.toLocaleDateString(loc(), {weekday: 'short'})}</text>`; });
  (opts.labels || []).forEach(v => g += `<text x="0" y="${Y(v) + 4}">${v}</text>`);
  if (opts.ref != null) g += `<line x1="${pad}" x2="${W}" y1="${Y(opts.ref)}" y2="${Y(opts.ref)}" stroke="#ea8a0c" stroke-dasharray="4"/>`;
  series.forEach(sr => {
    const pts = hours.filter(h => sr.get(h) != null).map(h => `${X(+h.c.date).toFixed(1)},${Y(sr.get(h)).toFixed(1)}`);
    if (pts.length < 2) return;
    if (sr.fill) g += `<polygon points="${X(x0)},${Y(lo)} ${pts.join(' ')} ${X(x1)},${Y(lo)}" fill="${sr.color}" fill-opacity=".15"/>`;
    g += `<polyline points="${pts.join(' ')}" fill="none" stroke="${sr.color}" stroke-width="2" ${sr.dash ? 'stroke-dasharray="4 3"' : ''}/>`;
  });
  (opts.marks || []).forEach(m => { const x = X(+m.date); if (x >= pad && x <= W) g += `<circle cx="${x}" cy="${Y(m.v)}" r="3" fill="${m.color}"/><text x="${x - 12}" y="${m.type === 'high' ? Y(m.v) - 6 : Y(m.v) + 14}">${fmtTime(m.date)}</text>`; });
  const now = Date.now(); if (now >= x0 && now <= x1) g += `<line x1="${X(now)}" x2="${X(now)}" y1="8" y2="${Hh - 22}" stroke="#888" stroke-width="1.5"/>`;
  const leg = series.filter(s => s.label).map(s => `<span style="margin-inline-end:12px"><i class="dot" style="background:${s.color}"></i>${s.label}</span>`).join('');
  return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" dir="ltr">${g}</svg>${leg ? `<div class="sub">${leg}</div>` : ''}`;
}

// ================= Fiche spot =================
let openId = null;
function openSpot(id) { openId = id; const s = allSpots().find(x => x.id === id); loadSpot(s); renderSheet(); document.getElementById('sheet').classList.add('open'); document.getElementById('sheet').scrollTop = 0; }
function closeSheet() { openId = null; document.getElementById('sheet').classList.remove('open'); }
const cell = (ic, l, v) => `<div class="cell"><div class="ic">${ic}</div><div class="v">${v}</div><div class="l">${l}</div></div>`;
const kv = (k, v) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`;

function renderSheet() {
  if (!openId) return;
  const s = allSpots().find(x => x.id === openId); if (!s) return closeSheet();
  const f = forecasts[s.id], h = currentHour(s), species = spotSpecies(s);
  let html = `<div class="sheethead"><h2>${esc(spotName(s))}</h2><button class="iconbtn" onclick="closeSheet()">✕</button></div>
    <div class="card"><div class="sub">${TYPE_ICON[s.type]} ${t('spot.type.' + s.type)} · ${t('coast.' + s.coast)}</div>
    ${spotNotes(s) ? `<p style="margin:8px 0">${esc(spotNotes(s))}</p>` : ''}
    <div>${species.map(x => `<span class="pill">${SP_ICON[x]} ${t('species.' + x)}</span>`).join('')}</div></div>`;
  if (f && h) {
    const c = h.c, m = moonInfo(c.date), fut = futureHours(s, 72), ws = windows(f.hours), dg = douglas(c.wave);
    if (h.dangerous) html += `<div class="card danger">⚠️ ${t('detail.danger')}</div>`;

    // Maintenant
    html += `<div class="card"><h3>${t('detail.now')}</h3>
      <div class="score"><div class="ring" style="border:6px solid ${pcol(h.total)};color:${pcol(h.total)};font-size:20px">${Math.round(h.total * 100)}%</div>
      <div><div class="sub">${t('chance.total')}</div><div style="font-size:18px;font-weight:700;color:${pcol(h.total)}">${t(h.total >= .6 ? 'chance.high' : h.total >= .35 ? 'chance.mid' : 'chance.low')}</div>
      <div class="sub" style="margin-top:4px">${t('detail.score')} : ${badge(h.score)} · ${t(labelKey(h.score))}</div></div></div></div>`;

    // Chances par espèce
    html += `<div class="card"><h3>${t('chance.title')}</h3>
      ${SPECIES.map(sp => ({sp, p: h.chances[sp], here: species.includes(sp)})).sort((a, b) => b.here - a.here || b.p - a.p).map(({sp, p, here}) => `
        <div class="sprow" style="${here ? '' : 'opacity:.5'}"><div class="nm">${SP_ICON[sp]} ${t('species.' + sp)}</div>
        <div class="bar"><i style="width:${Math.round(p * 100)}%;background:${pcol(p)}"></i></div><div class="pc">${Math.round(p * 100)}%</div></div>`).join('')}
      <div class="sub" style="margin-top:6px">${t('chance.note')}</div></div>`;

    // Meilleur moment par espèce
    html += `<div class="card"><h3>${t('chance.best')}</h3>${species.map(sp => { const b = bestHour(futureHours(s, 48), x => x.chances[sp]);
      return b ? `<div class="row"><span>${SP_ICON[sp]}</span><div class="grow"><div>${t('species.' + sp)}</div><div class="sub">${fmtAt(b.c.date)}</div></div>${pbadge(b.chances[sp])}</div>` : ''; }).join('')}</div>`;

    // État de la mer
    html += `<div class="card"><h3>🌊 ${t('sea.title')}</h3>`;
    if (f.hasMarine) {
      html += `<div class="seastate">${dg != null ? t('sea.douglas.' + dg) + ` <span class="sub">(Douglas ${dg})</span>` : ''}</div>
        ${kv(t('sea.total'), `${num(c.wave, 'm', 1)} · ${num(c.wper, 's')} · ${arrow(c.wdir)} ${cardinal(c.wdir)}`)}
        ${kv(t('sea.swell'), `${num(c.swH, 'm', 1)} · ${num(c.swPer, 's')} · ${arrow(c.swDir)} ${cardinal(c.swDir)}`)}
        ${kv(t('sea.windwave'), `${num(c.wwH, 'm', 1)} · ${num(c.wwPer, 's')} · ${arrow(c.wwDir)} ${cardinal(c.wwDir)}`)}
        ${kv(t('sea.current'), `${num(c.cur, 'km/h', 1)} ${c.curDir != null ? '→ ' + cardinal(c.curDir) : ''}`)}
        ${kv(t('sea.temp'), num(c.sea, '°C', 1))}
        ${kv(t('sea.clarity'), t('clarity.' + h.clarity))}
        ${kv(t('sea.visibility'), c.vis == null ? '—' : (c.vis / 1000).toFixed(c.vis < 10000 ? 1 : 0) + ' km')}`;
      html += lineChart(fut, [{get: x => x.c.wave, color: '#0b6e99', label: t('sea.total'), fill: 1}, {get: x => x.c.swH, color: '#7c3aed', label: t('sea.swell'), dash: 1}],
        {min: 0, max: Math.max(1, ...fut.map(x => Math.max(x.c.wave || 0, x.c.swH || 0))) * 1.15, labels: [0], h: 120});
    } else html += `<div class="sub">${t('sea.na')}</div>`;
    html += `</div>`;

    // Marée
    html += `<div class="card"><h3>🌗 ${t('tide.title')}</h3>`;
    if (f.tide.available && c.tide) {
      const nexts = f.tide.extremes.filter(e => +e.date > Date.now() - 1800e3).slice(0, 4);
      html += `<div class="seastate">${c.tide.slack ? t('tide.slack') : c.tide.rising ? '↑ ' + t('tide.rising') : '↓ ' + t('tide.falling')}${c.tide.big ? ` <span class="pill">${t('tide.big')}</span>` : ''}</div>
        ${nexts.map(e => kv(`${e.type === 'high' ? '⬆︎ ' + t('tide.high') : '⬇︎ ' + t('tide.low')}`, `${fmtAt(e.date)} · ${e.h.toFixed(2)} m`)).join('')}
        ${kv(t('tide.range'), num(c.tide.range, 'm', 2))}`;
      const sl = fut.filter(x => x.c.sl != null), vals = sl.map(x => x.c.sl);
      if (sl.length > 2) html += lineChart(sl, [{get: x => x.c.sl, color: '#0891b2', fill: 1}],
        {min: Math.min(...vals) - .05, max: Math.max(...vals) + .1, h: 120, marks: f.tide.extremes.filter(e => e.date >= sl[0].c.date && e.date <= sl[sl.length - 1].c.date).map(e => ({date: e.date, v: e.h, type: e.type, color: e.type === 'high' ? '#0891b2' : '#64748b'}))});
      html += `<div class="sub">${t('tide.note')}</div>`;
    } else html += `<div class="sub">${t('tide.na')}</div>`;
    html += `</div>`;

    // Météo
    html += `<div class="card"><h3>☁️ ${t('weather.title')}</h3><div class="grid">
        ${cell('🌡️', t('detail.temp'), num(c.temp, '°C'))}
        ${cell(arrow(c.dir), t('detail.wind'), num(c.wind, 'km/h') + ' ' + cardinal(c.dir))}
        ${cell('💨', t('detail.gusts'), num(c.gust, 'km/h'))}
        ${cell('🧭', t('detail.pressure'), num(c.pres, 'hPa'))}
        ${cell('🌧️', t('detail.rain'), num(c.pprob, '%'))}
        ${cell('☁️', t('weather.cloud'), num(c.cloud, '%'))}
      </div></div>`;

    // Soleil & lune
    const today = f.sun.find(x => x.set > Date.now()) || f.sun[0];
    html += `<div class="card"><h3>${t('sun.title')}</h3>
      ${kv('🌅 ' + t('sun.rise'), fmtTime(today.rise))}${kv('🌇 ' + t('sun.set'), fmtTime(today.set))}
      ${kv(m.icon + ' ' + t('detail.moon'), `${t(m.key)} · ${Math.round(moonIllum(c.date) * 100)} %`)}</div>`;

    // Facteurs
    html += `<div class="card"><h3>${t('detail.factors')}</h3>${h.factors.map(x => `<div class="fac" style="color:${x.pos ? 'var(--green)' : 'var(--red)'}">${x.pos ? '＋' : '−'} ${t(x.key)}</div>`).join('')}</div>`;

    // Courbe 72 h
    html += `<div class="card"><h3>${t('detail.forecast')}</h3>${lineChart(fut, [
      {get: x => x.total * 100, color: '#0b6e99', label: t('chance.short'), fill: 1},
      {get: x => x.score, color: '#16a34a', label: t('detail.score'), dash: 1}], {ref: THRESHOLD, labels: [0, 50, 100]})}</div>`;

    // Créneaux
    html += `<div class="card"><h3>${t('detail.windows')}</h3>${ws.length ? ws.slice(0, 5).map(w => `<div class="row"><span>🕒</span><div class="grow">${fmtRange(w)}</div>${pbadge(w.chance)}</div>`).join('') : `<div class="sub">${t('detail.noWindow')}</div>`}</div>`;

    // Heure par heure
    html += `<div class="card"><h3>${t('hourly.title')}</h3><div class="tbl"><table dir="ltr"><tr>
      <th>${t('hourly.h')}</th><th>🎣</th><th>${t('hourly.score')}</th><th>${t('detail.wind')}</th><th>${t('detail.waves')}</th><th>${t('hourly.tide')}</th></tr>
      ${futureHours(s, 24).map(x => `<tr><td>${fmtTime(x.c.date)}</td>
        <td style="color:${pcol(x.total)};font-weight:700">${Math.round(x.total * 100)}%</td>
        <td style="color:${color(x.score)}">${x.score}</td>
        <td>${x.c.wind != null ? Math.round(x.c.wind) : '—'} ${arrow(x.c.dir)}</td>
        <td>${x.c.wave != null ? x.c.wave.toFixed(1) + ' m' : '—'}</td>
        <td>${x.c.tide ? (x.c.tide.slack ? '•' : x.c.tide.rising ? '↑' : '↓') : '—'}</td></tr>`).join('')}
      </table></div></div>`;

    // Conseils
    html += `<div class="card"><h3>${t('detail.tips')}</h3>${contextTips(h, s).map(k => `<div class="row"><span>💡</span><div class="grow" style="font-size:14px">${t(k)}</div></div>`).join('')}</div>`;
  } else if (errors[s.id]) {
    html += `<div class="card"><p>${t('detail.error')}</p><button class="btn sec" onclick="retry('${s.id}')">${t('detail.retry')}</button></div>`;
  } else {
    html += `<div class="card">⏳ ${t('detail.loading')}</div>`;
  }
  html += `<a class="btn" href="https://maps.apple.com/?daddr=${s.lat},${s.lon}&dirflg=d" target="_blank" rel="noopener">🚗 ${t('detail.directions')}</a>`;
  html += `<a class="btn sec" style="margin-top:8px" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}" target="_blank" rel="noopener">Google Maps</a>`;
  if (s.custom) html += `<button class="btn del" style="margin-top:8px" onclick="deleteSpot('${s.id}')">🗑️ ${t('detail.delete')}</button>`;
  const el = document.getElementById('sheet'), y = el.scrollTop;
  el.innerHTML = html; el.scrollTop = y;
}
function retry(id) { delete errors[id]; renderSheet(); loadSpot(allSpots().find(x => x.id === id), true); }
function deleteSpot(id) { custom = custom.filter(x => x.id !== id); LS.set('customSpots', custom); delete forecasts[id]; closeSheet(); refreshAll(); }

// ================= Ajout de spot =================
function openAddForm() {
  const c = map.getCenter();
  document.getElementById('addsheet').innerHTML = `<div class="sheethead"><h2>${t('add.title')}</h2><button class="iconbtn" onclick="closeAdd()">✕</button></div>
  <form class="card" id="addform">
    <label class="f">${t('add.namePlaceholder')}</label><input type="text" id="a-name" required>
    <label class="f">${t('add.type')}</label><select id="a-type">${TYPES.map(x => `<option value="${x}">${t('spot.type.' + x)}</option>`).join('')}</select>
    <label class="f">${t('add.coast')}</label><select id="a-coast">${COASTS.map(x => `<option value="${x}">${t('coast.' + x)}</option>`).join('')}</select>
    <label class="f">${t('detail.species')}</label>${SPECIES.map(x => `<label class="chk"><input type="checkbox" value="${x}"> ${t('species.' + x)}</label>`).join('')}
    <div class="sub" dir="ltr" style="margin:10px 0">${c.lat.toFixed(4)}, ${c.lng.toFixed(4)}</div>
    <button class="btn" type="submit">${t('add.save')}</button>
  </form>`;
  document.getElementById('addsheet').classList.add('open');
  document.getElementById('addform').addEventListener('submit', e => {
    e.preventDefault();
    const name = document.getElementById('a-name').value.trim(); if (!name) return;
    const s = {id: 'c' + Date.now(), name: {fr: name, ar: name}, lat: c.lat, lon: c.lng, custom: true,
      type: document.getElementById('a-type').value, coast: document.getElementById('a-coast').value,
      species: [...document.querySelectorAll('#addform input[type=checkbox]:checked')].map(x => x.value)};
    custom.push(s); LS.set('customSpots', custom); closeAdd(); setAddMode(false); refreshAll(); loadSpot(s);
  });
}
function closeAdd() { document.getElementById('addsheet').classList.remove('open'); }

// ================= Onglets =================
const TABS = [['map', '🗺️', 'tab.map'], ['when', '🕒', 'tab.when'], ['tips', '💡', 'tab.tips'], ['settings', '⚙️', 'tab.settings']];
let tab = 'map';
function renderTabs() {
  document.getElementById('tabs').innerHTML = TABS.map(([id, ic, k]) => `<button class="${tab === id ? 'active' : ''}" onclick="go('${id}')"><span>${ic}</span>${t(k)}</button>`).join('');
}
function go(id) {
  tab = id; document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + id));
  renderTabs(); if (id === 'map') setTimeout(() => map.invalidateSize(), 50);
}
function renderWhen() {
  const ranked = allSpots().map(s => { const fh = futureHours(s, 48); const b = bestHour(fh, x => x.total); const now = fh[0];
      const topSp = b ? spotSpecies(s).slice().sort((x, y) => b.chances[y] - b.chances[x])[0] : null;
      return {s, b, now, topSp}; })
    .sort((a, b) => (b.b?.total ?? -1) - (a.b?.total ?? -1));
  const top = ranked[0];
  let html = '';
  if (top && top.b) html += `<div class="card" onclick="openSpot('${top.s.id}')" style="cursor:pointer"><h3>🏆 ${t('best.top')}</h3>
    <div style="font-size:20px;font-weight:700">${esc(spotName(top.s))}</div>
    <div style="margin:6px 0">🕒 ${fmtAt(top.b.c.date)} · ${SP_ICON[top.topSp]} ${t('species.' + top.topSp)}</div>
    <div class="big" style="color:${pcol(top.b.total)}">${pct(top.b.total)}</div><div class="sub">${t('chance.total')}</div></div>`;

  html += `<div class="card"><h3>${t('best.ranking')}</h3>${ranked.map(({s, b, now, topSp}) => `<div class="row" onclick="openSpot('${s.id}')" style="cursor:pointer">
    <div class="grow"><div>${esc(spotName(s))}</div><div class="sub">${b ? `${t('best.peak')} ${fmtAt(b.c.date)} · ${SP_ICON[topSp]} ${t('species.' + topSp)}` : t(errors[s.id] ? 'detail.error' : 'detail.loading')}</div>
    ${now ? `<div class="sub">${t('best.now')} : ${pct(now.total)}${now.c.wave != null ? ' · 🌊 ' + now.c.wave.toFixed(1) + ' m' : ''}${now.c.wind != null ? ' · 💨 ' + Math.round(now.c.wind) + ' km/h' : ''}</div>` : ''}</div>
    ${b ? pbadge(b.total) : ''}<span class="sub">›</span></div>`).join('')}</div>`;

  // Par espèce
  html += `<div class="card"><h3>${t('best.bySpecies')}</h3>${SPECIES.map(sp => {
    let best = null;
    allSpots().forEach(s => { if (!spotSpecies(s).includes(sp)) return; const b = bestHour(futureHours(s, 48), x => x.chances[sp]); if (b && (!best || b.chances[sp] > best.p)) best = {s, h: b, p: b.chances[sp]}; });
    return best ? `<div class="row" onclick="openSpot('${best.s.id}')" style="cursor:pointer"><span style="font-size:20px">${SP_ICON[sp]}</span>
      <div class="grow"><div><b>${t('species.' + sp)}</b> — ${esc(spotName(best.s))}</div><div class="sub">${fmtAt(best.h.c.date)}</div></div>${pbadge(best.p)}</div>` : '';
  }).join('')}</div>
  <div class="sub" style="padding:0 6px">${t('chance.note')} ${t('best.footer')}</div>`;
  document.getElementById('view-when').innerHTML = html;
}
function renderTips() {
  document.getElementById('view-tips').innerHTML = `
    <div class="card"><h3>${t('tips.reading.title')}</h3>${t('tips.reading.text')}<p>${t('tips.chance.text')}</p></div>
    <div class="card"><h3>🌊 ${t('tips.sea.title')}</h3>${t('tips.sea.text')}</div>
    <div class="card"><h3>${t('tips.species.title')}</h3>${SPECIES.map(x => `<details><summary>${SP_ICON[x]} ${t('species.' + x)}</summary><p>${t('tip.' + x)}</p></details>`).join('')}</div>
    <div class="card"><h3>🌬️ ${t('tips.wind.title')}</h3>${t('tips.wind.text')}</div>
    <div class="card"><h3>🎣 ${t('tips.gear.title')}</h3>${t('tips.gear.text')}</div>
    <div class="card"><h3>🦺 ${t('tips.safety.title')}</h3>${t('tips.safety.text')}</div>
    <div class="card"><h3>📜 ${t('tips.rules.title')}</h3>${t('tips.rules.text')}</div>`;
}
function renderSettings() {
  document.getElementById('view-settings').innerHTML = `
    <div class="card"><h3>${t('settings.language')}</h3><div class="seg">
      <button class="${lang === 'fr' ? 'on' : ''}" onclick="setLang('fr')">Français</button>
      <button class="${lang === 'ar' ? 'on' : ''}" onclick="setLang('ar')">العربية</button></div></div>
    <div class="card"><h3>📲 ${t('install.title')}</h3>${t('install.text')}</div>
    <div class="card"><h3>${t('settings.about')}</h3><p>${t('settings.aboutText')}</p><p class="sub">${t('settings.data')}</p><p class="sub">${t('settings.disclaimer')}</p></div>
    ${custom.length ? `<button class="btn del" onclick="resetCustom()">${t('settings.resetCustom')}</button>` : ''}`;
}
function resetCustom() { custom = []; LS.set('customSpots', custom); refreshAll(); }
function setLang(l) {
  lang = l; LS.set('lang', l);
  document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('langbtn').textContent = l === 'ar' ? 'FR' : 'ع';
  document.getElementById('title').textContent = '🎣 ' + (l === 'ar' ? 'صيد طنجة' : 'Pêche Tanger');
  renderLegend(); setAddMode(addMode); refreshAll();
}
function refreshAll() { renderMarkers(); renderTabs(); renderWhen(); renderTips(); renderSettings(); renderSheet(); }

// ================= Démarrage =================
initMap();
setLang(lang);
document.getElementById('langbtn').onclick = () => setLang(lang === 'ar' ? 'fr' : 'ar');
document.getElementById('refresh').onclick = () => loadAll(true);
document.getElementById('addbtn').onclick = () => setAddMode(!addMode);
let meMarker;
document.getElementById('locate').onclick = () => {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    if (meMarker) meMarker.remove();
    meMarker = L.circleMarker(ll, {radius: 8, color: '#fff', weight: 3, fillColor: '#2563eb', fillOpacity: 1}).addTo(map);
    map.setView(ll, 12);
  }, () => {}, {enableHighAccuracy: true, timeout: 10000});
};
loadAll();
setInterval(() => loadAll(), 30 * 60 * 1000);
</script>
