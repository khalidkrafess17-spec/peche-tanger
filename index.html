<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pêche Maroc</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pêche Maroc">
<meta name="theme-color" content="#0b6e99">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f2f4f7;--card:#fff;--text:#111;--muted:#6b7280;--accent:#0b6e99;--green:#16a34a;--orange:#ea8a0c;--red:#dc2626;--line:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1b1e24;--text:#f3f4f6;--muted:#9ca3af;--line:#2a2e36}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}
header{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;flex:1}
.iconbtn{border:0;background:none;color:var(--accent);font-size:20px;padding:6px 8px;cursor:pointer}
.langbtn{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:999px;padding:4px 12px;font-weight:600}
main{position:fixed;top:calc(env(safe-area-inset-top) + 50px);bottom:calc(env(safe-area-inset-bottom) + 58px);left:0;right:0}
.view{position:absolute;inset:0;overflow-y:auto;display:none;padding:12px}
.view.active{display:block}
#view-map{padding:0}
#map{position:absolute;inset:0}
nav{position:fixed;bottom:0;left:0;right:0;z-index:1000;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:8px 0 6px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:21px}
nav button.active{color:var(--accent)}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.sub{font-size:13px;color:var(--muted)}
.badge{font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.g{color:var(--green);background:#16a34a22}.o{color:var(--orange);background:#ea8a0c22}.r{color:var(--red);background:#dc262622}.n{color:var(--muted);background:#8882}
.pin{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px #0006;display:flex;align-items:center;justify-content:center;font-size:16px;position:relative}
.pin b{position:absolute;top:-9px;right:-12px;background:#fff;color:#000;font-size:10px;padding:0 4px;border-radius:8px;box-shadow:0 1px 2px #0004}
.legend{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:500;background:var(--card);border-radius:999px;padding:6px 14px;font-size:12px;display:flex;gap:12px;box-shadow:0 2px 8px #0003;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:4px;vertical-align:middle}
.fab{position:absolute;z-index:500;right:12px;width:46px;height:46px;border-radius:50%;border:0;background:var(--card);color:var(--accent);font-size:22px;box-shadow:0 2px 8px #0004}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:600;font-size:44px;color:var(--accent);pointer-events:none;display:none}
#addbar{position:absolute;left:12px;right:12px;bottom:12px;z-index:600;display:none}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:12px;font-size:16px;font-weight:600;background:var(--accent);color:#fff;text-align:center;text-decoration:none;cursor:pointer}
.btn.sec{background:#0b6e9922;color:var(--accent)}.btn.del{background:#dc262622;color:var(--red)}
.sheet{position:fixed;inset:0;z-index:2000;background:var(--bg);overflow-y:auto;display:none;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 16px)}
.sheet.open{display:block}
.sheethead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sheethead h2{flex:1;margin:0;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{text-align:center;padding:8px 2px;border-radius:10px;background:var(--bg)}
.cell .ic{font-size:18px}.cell .v{font-weight:700;font-size:14px}.cell .l{font-size:11px;color:var(--muted)}
.score{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.ring{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
.fac{padding:4px 0;font-size:14px}
.danger{background:#dc262622;color:var(--red);font-weight:600}
details{border-bottom:1px solid var(--line);padding:10px 0}details:last-child{border:0}
summary{font-weight:600;cursor:pointer}
details p{margin:8px 0 0;font-size:14px}
label.f{display:block;margin:10px 0 4px;font-size:13px;color:var(--muted)}
input[type=text],select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
svg text{fill:var(--muted);font-size:10px}
.leaflet-container{font:inherit}
[dir=rtl] .fab{right:auto;left:12px}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:6px}
.sprow{display:flex;align-items:center;gap:10px;padding:7px 0}
.sprow .nm{width:42%;font-size:14px}
.sprow .pc{width:44px;text-align:end;font-weight:700;font-size:14px}
.big{font-size:34px;font-weight:800;line-height:1}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg);margin:2px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
.tbl th,.tbl td{padding:6px 6px;text-align:center;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-weight:600;font-size:11px}
.seastate{font-size:18px;font-weight:700;margin-bottom:8px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}
.techlink{color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px dotted var(--accent)}
.mapsel{position:absolute;top:12px;left:12px;z-index:500;max-width:62%;padding:9px 10px;border-radius:12px;border:0;background:var(--card);color:var(--text);font-size:15px;box-shadow:0 2px 8px #0004}
[dir=rtl] .mapsel{left:auto;right:12px}
.filters{display:flex;gap:8px;margin-bottom:12px}.filters select{flex:1;font-size:15px;padding:9px}
.star{font-size:24px;border:0;background:none;cursor:pointer}
.pin.sm{width:16px;height:16px;font-size:0;border-width:1.5px}.kv span:first-child{color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1 id="title">🎣 Pêche Maroc</h1>
  <button class="iconbtn" id="refresh" title="↻">↻</button>
  <button class="langbtn" id="langbtn">ع</button>
</header>

<main>
  <section class="view active" id="view-map">
    <div id="map" dir="ltr"></div>
    <select id="regionsel" class="mapsel"></select>
    <div id="cross">⊕</div>
    <button class="fab" id="locate" style="top:12px">➤</button>
    <button class="fab" id="addbtn" style="top:66px">＋</button>
    <div class="legend" id="legend"></div>
    <div id="addbar" class="card"></div>
  </section>
  <section class="view" id="view-when"></section>
  <section class="view" id="view-tips"></section>
  <section class="view" id="view-settings"></section>
</main>

<nav id="tabs"></nav>
<div class="sheet" id="sheet"></div>
<div class="sheet" id="addsheet"></div>

"هلال متناقص"}, "dir.N": {"fr": "N", "ar": "ش"}, "dir.NE": {"fr": "NE", "ar": "ش.ق"}, "dir.E": {"fr": "E", "ar": "ق"}, "dir.SE": {"fr": "SE", "ar": "ج.ق"}, "dir.S": {"fr": "S", "ar": "ج"}, "dir.SW": {"fr": "SO", "ar": "ج.غ"}, "dir.W": {"fr": "O", "ar": "غ"}, "dir.NW": {"fr": "NO", "ar": "ش.غ"}, "day.today": {"fr": "Aujourd'hui", "ar": "اليوم"}, "day.tomorrow": {"fr": "Demain", "ar": "غداً"}, "tips.reading.title": {"fr": "Lire l'indice", "ar": "قراءة المؤشر"}, "tips.reading.text": {"fr": "Indice 0–100 : note les conditions générales (vert ≥ 65). Les créneaux proposés regroupent les heures favorables consécutives.", "ar": "المؤشر 0–100: يقيّم الظروف العامة (أخضر 65 فأكثر). الأوقات المقترحة تجمع الساعات المناسبة المتتالية."}, "tips.species.title": {"fr": "Par espèce", "ar": "حسب النوع"}, "tip.seaBass": {"fr": "Automne–hiver surtout. Mer formée et écume, à l'aube, au crépuscule et la nuit. Poissons nageurs, leurres souples, ou ver/sardine en surfcasting. Rochers, plages, estuaires.", "ar": "خاصة في الخريف والشتاء. بحر متحرك وزبد، عند الفجر والغروب وليلاً. طعوم اصطناعية سابحة أو لينة، أو دود/سردين بالرمي. الصخور والشواطئ والمصبات."}, "tip.seaBream": {"fr": "Printemps à automne. Eau plutôt calme et claire, fonds sableux ou mixtes. Crabe, couteau, ver. Pêche au fond, ferrage franc.", "ar": "من الربيع إلى الخريف. ماء هادئ وصافٍ، قاع رملي أو مختلط. سلطعون، موس البحر، دود. صيد بالقاع مع جذب حازم."}, "tip.whiteBream": {"fr": "Toute l'année près des rochers, surtout en eau légèrement remuée. Moule, crevette, ver. Flotteur ou fond léger, bas de ligne fin.", "ar": "طوال السنة قرب الصخور، خاصة في ماء متحرك قليلاً. بلح البحر، قمرون، دود. عوامة أو قاع خفيف بخيط رفيع."}, "tip.mackerel": {"fr": "Été surtout, en bancs près de la surface, le matin. Mitraillette (plumes) ou petits leurres métalliques depuis les digues.", "ar": "خاصة في الصيف، أسراب قرب السطح صباحاً. سلسلة الريش أو طعوم معدنية صغيرة من الحواجز."}, "tip.squid": {"fr": "Automne–hiver, la nuit, en eau claire. Turluttes (egi) animées lentement, sous les lumières des jetées.", "ar": "الخريف والشتاء، ليلاً، في ماء صافٍ. إيجي بحركة بطيئة تحت أضواء الأرصفة."}, "tips.wind.title": {"fr": "Les vents du détroit", "ar": "رياح المضيق"}, "tips.wind.text": {"fr": "Chergui (est/levante) : la côte méditerranéenne prend le vent, l'Atlantique est plus abrité. Gharbi (ouest/poniente) : l'inverse. Choisissez toujours une côte où le vent vient de la terre.", "ar": "الشرقي: ساحل المتوسط يتعرض للريح والأطلسي أكثر حماية. الغربي: العكس. اختر دائماً ساحلاً تأتي فيه الريح من البر."}, "tips.gear.title": {"fr": "Matériel de base", "ar": "المعدات الأساسية"}, "tips.gear.text": {"fr": "Canne 3–4,5 m pour rochers/plage, moulinet 4000–5000, tresse 0,14–0,18 + bas de ligne fluoro. Plombs 60–150 g selon le courant. Lampe frontale, gants, bottes antidérapantes.", "ar": "قصبة 3–4.5 م للصخور والشاطئ، بكرة 4000–5000، خيط مضفور 0.14–0.18 مع خيط فلورو. رصاص 60–150 غ حسب التيار. مصباح رأس، قفازات، أحذية مانعة للانزلاق."}, "tips.safety.title": {"fr": "Sécurité", "ar": "السلامة"}, "tips.safety.text": {"fr": "Ne pêchez jamais seul sur les rochers par mer forte. Surveillez la marée montante, gardez une voie de repli, portez des chaussures antidérapantes et prévenez un proche.", "ar": "لا تصطد وحدك على الصخور في بحر هائج. راقب المد، احتفظ بطريق للعودة، البس حذاءً مانعاً للانزلاق وأخبر أحد أقاربك."}, "tips.rules.title": {"fr": "Réglementation", "ar": "القوانين"}, "tips.rules.text": {"fr": "Respectez les tailles minimales, les zones portuaires et militaires interdites et les périodes de repos biologique. Renseignez-vous auprès du Département de la Pêche Maritime avant de pêcher.", "ar": "احترم الأحجام الدنيا والمناطق المينائية والعسكرية الممنوعة وفترات الراحة البيولوجية. استفسر لدى قطاع الصيد البحري قبل الصيد."}, "settings.language": {"fr": "Langue", "ar": "اللغة"}, "settings.about": {"fr": "À propos", "ar": "حول التطبيق"}, "settings.aboutText": {"fr": "Pêche Maroc calcule pour chaque spot de la côte marocaine un indice et une probabilité de prise à partir des prévisions météo, marines, des marées et de la lune.", "ar": "يحسب تطبيق صيد المغرب لكل مكان على الساحل المغربي مؤشراً واحتمالاً للصيد انطلاقاً من توقعات الطقس والبحر والمد والقمر."}, "settings.data": {"fr": "Météo, mer, courants et marées : Open-Meteo.com (gratuit, sans compte).", "ar": "الطقس والبحر والتيارات والمد: Open-Meteo.com (مجاني وبدون حساب)."}, "settings.disclaimer": {"fr": "Spots et zones interdites indicatifs. Vérifiez toujours la réglementation et l'accès sur place.", "ar": "الأماكن والمناطق الممنوعة تقريبية. تحقق دائماً من القوانين وإمكانية الوصول في عين المكان."}, "settings.resetCustom": {"fr": "Supprimer mes spots personnels", "ar": "حذف أماكني الشخصية"}, "map.locate": {"fr": "Ma position", "ar": "موقعي"}, "common.close": {"fr": "Fermer", "ar": "إغلاق"}, "install.title": {"fr": "Installer sur l'iPhone", "ar": "التثبيت على الآيفون"}, "install.text": {"fr": "Dans Safari : bouton Partager ⬆︎ puis « Sur l'écran d'accueil ».", "ar": "في سفاري: زر المشاركة ⬆︎ ثم «إضافة إلى الشاشة الرئيسية»."}, "detail.error": {"fr": "Impossible de charger la météo (connexion ?).", "ar": "تعذّر تحميل الطقس (الاتصال؟)."}, "settings.updated": {"fr": "Dernière mise à jour", "ar": "آخر تحديث"}, "legend.chance": {"fr": "Chance de prise", "ar": "احتمال الصيد"}, "chance.title": {"fr": "Chances de prise par espèce (session de 2 h)", "ar": "احتمال الصيد حسب النوع (جلسة ساعتين)"}, "chance.total": {"fr": "Chance de prendre au moins un poisson (2 h)", "ar": "احتمال صيد سمكة واحدة على الأقل (ساعتان)"}, "chance.high": {"fr": "Bonnes chances", "ar": "حظوظ جيدة"}, "chance.mid": {"fr": "Chances moyennes", "ar": "حظوظ متوسطة"}, "chance.low": {"fr": "Faibles chances", "ar": "حظوظ ضعيفة"}, "chance.best": {"fr": "Meilleur moment par espèce (48 h)", "ar": "أفضل وقت لكل نوع (48 ساعة)"}, "chance.note": {"fr": "Estimation indicative (saison, heure, mer, marée, météo) — ce n'est pas une garantie.", "ar": "تقدير تقريبي (الموسم، الوقت، البحر، المد، الطقس) — وليس ضماناً."}, "chance.short": {"fr": "Chance de prise", "ar": "احتمال الصيد"}, "sea.title": {"fr": "État de la mer", "ar": "حالة البحر"}, "sea.douglas.0": {"fr": "Calme", "ar": "هادئ تماماً"}, "sea.douglas.1": {"fr": "Ridée", "ar": "مموّج قليلاً"}, "sea.douglas.2": {"fr": "Belle", "ar": "خفيف"}, "sea.douglas.3": {"fr": "Peu agitée", "ar": "قليل الاضطراب"}, "sea.douglas.4": {"fr": "Agitée", "ar": "مضطرب"}, "sea.douglas.5": {"fr": "Forte", "ar": "هائج"}, "sea.douglas.6": {"fr": "Très forte", "ar": "هائج جداً"}, "sea.douglas.7": {"fr": "Grosse", "ar": "عاتٍ"}, "sea.total": {"fr": "Vagues (total)", "ar": "الأمواج (المجموع)"}, "sea.swell": {"fr": "Houle", "ar": "الموج الطويل"}, "sea.windwave": {"fr": "Mer du vent", "ar": "أمواج الرياح"}, "sea.current": {"fr": "Courant", "ar": "التيار"}, "sea.temp": {"fr": "Température de l'eau", "ar": "حرارة الماء"}, "sea.clarity": {"fr": "Clarté de l'eau (estimée)", "ar": "صفاء الماء (تقديري)"}, "sea.visibility": {"fr": "Visibilité", "ar": "الرؤية"}, "sea.na": {"fr": "Données de mer indisponibles pour ce point.", "ar": "بيانات البحر غير متوفرة لهذا المكان."}, "clarity.clear": {"fr": "Claire", "ar": "صافية"}, "clarity.slight": {"fr": "Légèrement trouble", "ar": "عكرة قليلاً"}, "clarity.turbid": {"fr": "Trouble", "ar": "عكرة"}, "tide.title": {"fr": "Marée", "ar": "المد والجزر"}, "tide.high": {"fr": "Pleine mer", "ar": "مد عالٍ"}, "tide.low": {"fr": "Basse mer", "ar": "جزر"}, "tide.rising": {"fr": "Marée montante", "ar": "مد صاعد"}, "tide.falling": {"fr": "Marée descendante", "ar": "مد نازل"}, "tide.slack": {"fr": "Étale", "ar": "ركود"}, "tide.range": {"fr": "Marnage", "ar": "مدى المد"}, "tide.big": {"fr": "Grande marée", "ar": "مد كبير"}, "tide.note": {"fr": "Calculée à partir d'un modèle océanique : horaires indicatifs (± 30–60 min).", "ar": "محسوبة من نموذج محيطي: أوقات تقريبية (± 30–60 دقيقة)."}, "tide.na": {"fr": "Données de marée indisponibles ici.", "ar": "بيانات المد غير متوفرة هنا."}, "weather.title": {"fr": "Météo", "ar": "الطقس"}, "weather.cloud": {"fr": "Nuages", "ar": "الغيوم"}, "sun.title": {"fr": "Soleil & lune", "ar": "الشمس والقمر"}, "sun.rise": {"fr": "Lever", "ar": "الشروق"}, "sun.set": {"fr": "Coucher", "ar": "الغروب"}, "hourly.title": {"fr": "Heure par heure (24 h)", "ar": "ساعة بساعة (24 ساعة)"}, "hourly.h": {"fr": "Heure", "ar": "الساعة"}, "hourly.score": {"fr": "Indice", "ar": "المؤشر"}, "hourly.tide": {"fr": "Marée", "ar": "المد"}, "best.bySpecies": {"fr": "Meilleur spot par espèce (48 h)", "ar": "أفضل مكان لكل نوع (48 ساعة)"}, "best.peak": {"fr": "Pic :", "ar": "الذروة:"}, "best.now": {"fr": "Maintenant", "ar": "الآن"}, "f.tide.moving": {"fr": "Marée en mouvement", "ar": "المد في حركة"}, "f.tide.slack": {"fr": "Étale de marée", "ar": "ركود المد"}, "f.tide.rising": {"fr": "Marée montante sur ce type de spot", "ar": "مد صاعد في هذا النوع من الأماكن"}, "f.tide.big": {"fr": "Grande marée", "ar": "مد كبير"}, "f.current.strong": {"fr": "Courant fort", "ar": "تيار قوي"}, "f.clarity.turbid": {"fr": "Eau trouble", "ar": "ماء عكر"}, "f.swell.long": {"fr": "Houle longue et puissante", "ar": "موج طويل وقوي"}, "ctx.current": {"fr": "Courant fort : plombs grappins et postes en contre-courant.", "ar": "تيار قوي: استعمل رصاصاً بمخالب وابحث عن المناطق الهادئة."}, "ctx.tide.rising": {"fr": "Marée montante : les poissons approchent du bord, pêchez près des rochers et des failles.", "ar": "المد الصاعد: الأسماك تقترب من الشاطئ، اصطد قرب الصخور والشقوق."}, "ctx.tide.slack": {"fr": "Étale : activité souvent réduite, profitez-en pour changer de poste ou d'appât.", "ar": "الركود: النشاط غالباً ضعيف، استغله لتغيير المكان أو الطعم."}, "ctx.turbid": {"fr": "Eau trouble : appâts odorants (sardine, ver) et leurres voyants ou bruyants.", "ar": "ماء عكر: طعم ذو رائحة قوية (سردين، دود) وطعوم لامعة أو مُصدرة للصوت."}, "ctx.swell.long": {"fr": "Houle longue : les vagues arrivent par séries puissantes, restez loin du bord des rochers.", "ar": "موج طويل: الأمواج تأتي على دفعات قوية، ابتعد عن حافة الصخور."}, "tips.chance.text": {"fr": "Le % sur la carte est la probabilité estimée de prendre au moins un poisson en 2 h, selon les espèces du spot. Il combine la saison, l'heure, l'état de la mer, la marée, la clarté et la température de l'eau.", "ar": "النسبة على الخريطة هي الاحتمال التقديري لصيد سمكة واحدة على الأقل خلال ساعتين حسب أنواع المكان. تجمع الموسم والوقت وحالة البحر والمد وصفاء الماء وحرارته."}, "tips.sea.title": {"fr": "Lire l'état de la mer", "ar": "قراءة حالة البحر"}, "tips.sea.text": {"fr": "Houle = vagues venues du large (période longue, puissante). Mer du vent = vagues locales créées par le vent. Pour le bar : 0,5–1,5 m avec de l'écume. Pour sar et dorade : mer belle à peu agitée. Au-delà de 2,5 m ou avec une houle longue (> 12 s), évitez les rochers. Marée : les 2 heures autour de la mi-marée sont souvent les meilleures.", "ar": "الموج الطويل = أمواج قادمة من عرض البحر (دورة طويلة وقوية). أمواج الرياح = أمواج محلية يصنعها الريح. للقاروص: 0.5–1.5 م مع الزبد. للشرغو والدنيس: بحر خفيف إلى قليل الاضطراب. فوق 2.5 م أو مع موج طويل (أكثر من 12 ث) تجنّب الصخور. المد: الساعتان حول منتصف المد غالباً الأفضل."}, "species.meagre": {"fr": "Courbine", "ar": "الكوربينا"}, "species.leerfish": {"fr": "Liche", "ar": "الليشة"}, "tip.meagre": {"fr": "Printemps–été au nord, quasiment toute l'année dans le sud (Dakhla, Akhfennir, Tarfaya). Plages et estuaires, mer formée, aube, crépuscule et nuit. Sardine, calamar, gros vers ou poissons nageurs. Matériel solide (tresse 0,20+), elle peut dépasser 20 kg.", "ar": "الربيع والصيف في الشمال، وتقريباً طوال السنة في الجنوب (الداخلة، أخفنير، طرفاية). الشواطئ والمصبات، بحر متحرك، الفجر والغروب والليل. سردين، كلمار، دود كبير أو طعوم سابحة. معدات قوية (خيط مضفور 0.20 فأكثر)، قد يتجاوز وزنها 20 كغ."}, "tip.leerfish": {"fr": "Été–automne, eaux chaudes et claires, près des rochers et des pointes. Chasse en surface à l'aube : poppers, stickbaits ou vif (mulet, bogue).", "ar": "الصيف والخريف، مياه دافئة وصافية قرب الصخور والرؤوس. تصطاد على السطح عند الفجر: طعوم سطحية أو طعم حي (البوري، البوقة)."}, "region.custom": {"fr": "Mes spots", "ar": "أماكني"}, "filter.all": {"fr": "Toute la côte du Maroc", "ar": "كل سواحل المغرب"}, "filter.allSpecies": {"fr": "Toutes les espèces", "ar": "كل الأنواع"}, "filter.none": {"fr": "Aucun spot pour ce filtre.", "ar": "لا يوجد مكان لهذا الاختيار."}, "sort.chance": {"fr": "Meilleures chances", "ar": "أفضل الحظوظ"}, "sort.near": {"fr": "Près de moi", "ar": "قريب مني"}, "fav.title": {"fr": "Mes favoris", "ar": "المفضلة"}, "chance.species": {"fr": "Chance pour cette espèce (2 h)", "ar": "احتمال صيد هذا النوع (ساعتان)"}, "best.updated": {"fr": "Mis à jour à", "ar": "آخر تحديث على"}, "f.wind.onshore": {"fr": "Vent du large : côte exposée", "ar": "ريح من البحر: الساحل مكشوف"}, "f.wind.offshore": {"fr": "Vent de terre : mer plus calme au bord", "ar": "ريح من البر: البحر أهدأ قرب الشاطئ"}, "f.solunar.major": {"fr": "Période solunaire majeure", "ar": "فترة قمرية رئيسية"}, "f.solunar.minor": {"fr": "Période solunaire mineure", "ar": "فترة قمرية ثانوية"}, "ctx.onshore": {"fr": "Vent du large : cherchez une baie abritée ou le côté sous le vent d'un cap, plombs plus lourds.", "ar": "ريح من البحر: ابحث عن خليج محمي أو الجهة المحمية من الرأس، واستعمل رصاصاً أثقل."}, "ctx.offshore": {"fr": "Vent de terre : mer lissée près du bord, idéal pour les leurres légers et le flotteur.", "ar": "ريح من البر: البحر هادئ قرب الشاطئ، مثالي للطعوم الخفيفة والعوامة."}, "ctx.solunar": {"fr": "Période solunaire majeure en cours : restez à poste, l'activité peut monter d'un coup.", "ar": "فترة قمرية رئيسية الآن: ابقَ في مكانك، قد يرتفع النشاط فجأة."}, "ctx.meagre": {"fr": "Courbine : pêchez l'écume et les bords de chenaux avec un gros appât (sardine, calamar), soyez patient.", "ar": "الكوربينا: اصطد في الزبد وحواف القنوات بطعم كبير (سردين، كلمار) وتحلَّ بالصبر."}, "sol.title": {"fr": "Périodes solunaires (24 h)", "ar": "الفترات القمرية (24 ساعة)"}, "sol.major": {"fr": "Période majeure", "ar": "فترة رئيسية"}, "sol.majorUp": {"fr": "Majeure – lune au zénith", "ar": "رئيسية – القمر في السمت"}, "sol.majorDown": {"fr": "Majeure – lune au nadir", "ar": "رئيسية – القمر في النظير"}, "sol.moonrise": {"fr": "Mineure – lever de lune", "ar": "ثانوية – شروق القمر"}, "sol.moonset": {"fr": "Mineure – coucher de lune", "ar": "ثانوية – غروب القمر"}, "sol.inMajor": {"fr": "En période solunaire majeure", "ar": "في فترة قمرية رئيسية"}, "sol.inMinor": {"fr": "En période solunaire mineure", "ar": "في فترة قمرية ثانوية"}, "sol.note": {"fr": "Théorie solunaire : le passage et le lever/coucher de la lune coïncident souvent avec des pics d'activité. Bonus léger dans l'indice.", "ar": "النظرية القمرية: مرور القمر وشروقه وغروبه يتزامن غالباً مع ذروة نشاط الأسماك. أثر خفيف في المؤشر."}, "tips.solunar.title": {"fr": "Périodes solunaires", "ar": "الفترات القمرية"}, "tips.solunar.text": {"fr": "Majeures (≈ 2 h) : lune au plus haut ou au plus bas. Mineures (≈ 1 h 30) : lever et coucher de la lune. Quand une période majeure tombe à l'aube ou au crépuscule avec une marée qui bouge, c'est souvent le meilleur moment de la journée.", "ar": "الرئيسية (حوالي ساعتين): القمر في أعلى أو أدنى نقطة. الثانوية (حوالي ساعة ونصف): شروق وغروب القمر. عندما تتزامن فترة رئيسية مع الفجر أو الغروب ومع مد متحرك، فهو غالباً أفضل وقت في اليوم."}, "tips.regions.title": {"fr": "La côte marocaine", "ar": "الساحل المغربي"}, "tips.regions.text": {"fr": "Méditerranée (Saïdia → Fnideq) : mer souvent calme, eau claire, sar, dorade, calamar, liche en été. Détroit : courants forts, vents Chergui/Gharbi. Atlantique nord (Asilah → Safi) : houle fréquente, bar et sar l'hiver, estuaires riches. Essaouira → Agadir : alizés réguliers, eau plus fraîche (upwelling). Sud (Tan-Tan → Dakhla) : côte sauvage, courbine et grosses dorades, vent du nord-est fréquent.", "ar": "المتوسط (السعيدية ← الفنيدق): بحر هادئ غالباً، ماء صافٍ، الشرغو، الدنيس، الكلمار، والليشة صيفاً. المضيق: تيارات قوية ورياح الشرقي والغربي. الأطلسي الشمالي (أصيلة ← آسفي): أمواج متكررة، القاروص والشرغو شتاءً، مصبات غنية. الصويرة ← أكادير: رياح منتظمة وماء أبرد. الجنوب (طانطان ← الداخلة): ساحل بري، الكوربينا والدنيس الكبير، ورياح شمالية شرقية متكررة."}, "settings.regions": {"fr": "régions", "ar": "جهات"}, "week.title": {"fr": "Prévisions 7 jours", "ar": "توقعات 7 أيام"}, "week.best": {"fr": "Meilleur jour", "ar": "أفضل يوم"}, "week.bestOverall": {"fr": "Meilleur jour pour pêcher (7 jours)", "ar": "أفضل يوم للصيد (7 أيام)"}, "week.lessReliable": {"fr": "prévision moins fiable", "ar": "توقع أقل دقة"}, "week.q.excellent": {"fr": "Excellent", "ar": "ممتاز"}, "week.q.good": {"fr": "Bon", "ar": "جيد"}, "week.q.fair": {"fr": "Moyen", "ar": "متوسط"}, "week.q.poor": {"fr": "Faible", "ar": "ضعيف"}, "week.goodSpots": {"fr": "spots favorables", "ar": "أماكن مناسبة"}, "week.goodHours": {"fr": "heures favorables", "ar": "ساعات مناسبة"}, "week.peak": {"fr": "Meilleure heure", "ar": "أفضل ساعة"}, "week.note": {"fr": "Touchez un jour pour voir le détail. Au-delà de 3 jours, la prévision est moins fiable : revérifiez la veille.", "ar": "المس يوماً لرؤية التفاصيل. بعد 3 أيام يصبح التوقع أقل دقة: تحقق مرة أخرى في اليوم السابق."}, "plan.title": {"fr": "Quoi pêcher et comment", "ar": "ماذا تصطاد وكيف"}, "plan.now": {"fr": "Conseillé maintenant", "ar": "المقترح الآن"}, "plan.method": {"fr": "Méthode", "ar": "الطريقة"}, "plan.or": {"fr": "ou", "ar": "أو"}, "plan.then": {"fr": "sinon", "ar": "وإلا"}, "tech.surfcasting": {"fr": "Surfcasting", "ar": "الصيد بالرمي (سيرفكاستينغ)"}, "tech.spinning": {"fr": "Spinning (leurres)", "ar": "سبينينغ (طعوم اصطناعية)"}, "tech.float": {"fr": "Pêche au flotteur", "ar": "الصيد بالعوامة"}, "tech.bottom": {"fr": "Pêche au fond léger", "ar": "الصيد بالقاع الخفيف"}, "tech.eging": {"fr": "Eging (turlutte)", "ar": "الإيجي (صيد الكلمار)"}, "tech.sabiki": {"fr": "Mitraillette (sabiki)", "ar": "السلسلة (الريش)"}, "tech.surfcasting.how": {"fr": "Canne 4–4,5 m, plomb 100–150 g, bas de ligne 1–2 hameçons. Lancez derrière la 2ᵉ vague, dans l'écume.", "ar": "قصبة 4–4.5 م، رصاص 100–150 غ، خيط بصنارة أو اثنتين. ارمِ خلف الموجة الثانية في الزبد."}, "tech.spinning.how": {"fr": "Canne 2,7–3 m, tresse 0,12–0,16 + fluoro. Poissons nageurs et leurres souples ; poppers en surface à l'aube.", "ar": "قصبة 2.7–3 م، خيط مضفور 0.12–0.16 مع فلورو. طعوم سابحة ولينة، وطعوم سطحية عند الفجر."}, "tech.float.how": {"fr": "Canne 4–5 m, flotteur 2–6 g, hameçon fin n°8–12. Amorcez avec sardine écrasée ou pain mouillé.", "ar": "قصبة 4–5 م، عوامة 2–6 غ، صنارة رفيعة رقم 8–12. استعمل طُعماً مجذباً من السردين المهروس أو الخبز المبلل."}, "tech.bottom.how": {"fr": "Plomb coulissant 20–60 g, bas de ligne fluoro 0,25–0,30. Pêchez au ras des rochers et dans les failles.", "ar": "رصاص منزلق 20–60 غ، خيط فلورو 0.25–0.30. اصطد قرب الصخور وفي الشقوق."}, "tech.eging.how": {"fr": "Turluttes taille 2.5–3.5 : tirées puis laissées descendre lentement. Sous les lumières, en eau claire.", "ar": "إيجي مقاس 2.5–3.5: اسحب ثم اتركه ينزل ببطء. تحت الأضواء وفي ماء صافٍ."}, "tech.sabiki.how": {"fr": "Mitraillette 6–8 plumes + plomb 30–60 g. Animez par tirées verticales, cherchez les bancs en surface.", "ar": "سلسلة 6–8 ريشات مع رصاص 30–60 غ. حرّكها عمودياً وابحث عن الأسراب قرب السطح."}, "bait.seaBass": {"fr": "Vers (américain, néréis), sardine, crevette vivante ; leurres poissons nageurs.", "ar": "دود (أمريكي، نيريس)، سردين، قمرون حي؛ طعوم سابحة."}, "bait.seaBream": {"fr": "Crabe, couteau, ver de sable, moule.", "ar": "سلطعون، موس البحر، دود الرمل، بلح البحر."}, "bait.whiteBream": {"fr": "Moule, crevette, ver ; amorce pain + sardine.", "ar": "بلح البحر، قمرون، دود؛ طُعم مجذب من الخبز والسردين."}, "bait.meagre": {"fr": "Sardine entière, calamar, mulet ; gros leurres souples la nuit.", "ar": "سردين كامل، كلمار، بوري؛ طعوم لينة كبيرة ليلاً."}, "bait.leerfish": {"fr": "Vif (mulet, bogue), poppers, stickbaits.", "ar": "طعم حي (بوري، بوقة)، طعوم سطحية."}, "bait.mackerel": {"fr": "Plumes, petits leurres métalliques, lanières de sardine.", "ar": "ريش، طعوم معدنية صغيرة، شرائح السردين."}, "bait.squid": {"fr": "Turluttes (egi) naturelles le jour de lune, fluo/UV par nuit noire.", "ar": "إيجي بألوان طبيعية في الليالي المقمرة، وفسفوري في الليالي المظلمة."}, "zone.title": {"fr": "Où aller chaque jour : la zone la plus conseillée", "ar": "أين تذهب كل يوم: المنطقة الأنسب"}, "zone.bestSpot": {"fr": "Meilleur spot", "ar": "أفضل مكان"}, "zone.near": {"fr": "Près de toi (≤ 150 km)", "ar": "قريب منك (≤ 150 كم)"}, "zone.map": {"fr": "Carte", "ar": "الخريطة"}, "zone.note": {"fr": "La note d'une zone est la moyenne de ses 3 meilleurs spots ce jour-là. Touchez une ligne pour ouvrir le spot.", "ar": "تقييم المنطقة هو معدل أفضل 3 أماكن فيها ذلك اليوم. المس سطراً لفتح المكان."}, "zone.nearHint": {"fr": "Activez « Près de moi » pour voir aussi la meilleure option proche de vous.", "ar": "فعّل «قريب مني» لرؤية أفضل خيار قريب منك أيضاً."}, "zone.seeAll": {"fr": "Voir la meilleure zone du Maroc pour chaque jour", "ar": "عرض أفضل منطقة في المغرب لكل يوم"}, "td.surfcasting.desc": {"fr": "Pêche du bord en lançant loin un appât naturel qui repose sur le fond, depuis une plage ou un estuaire. La canne reste posée sur un pique et on surveille le scion.", "ar": "صيد من الشاطئ برمي طعم طبيعي بعيداً ليستقر في القاع، من شاطئ أو مصب. تبقى القصبة على حامل ونراقب رأسها."}, "td.surfcasting.when": {"fr": "Mer formée (0,5–2 m) avec de l'écume, de nuit, à l'aube et au crépuscule, surtout à la marée montante. Évitez la mer d'huile en plein jour et les vagues de plus de 2,5 m.", "ar": "بحر متحرك (0.5–2 م) مع زبد، ليلاً وعند الفجر والغروب، خاصة مع المد الصاعد. تجنّب البحر الساكن نهاراً والأمواج التي تتجاوز 2.5 م."}, "td.surfcasting.gear": {"fr": "Canne de surfcasting 4,2–4,5 m (puissance 100–200 g) · Moulinet 5000–8000 à grande bobine · Nylon 0,30–0,35 ou tresse 0,16–0,20 · Arrache-plomb (tête de ligne) 0,50–0,60, environ 10 m · Plombs 80–150 g, grappins si courant · Pique de sable, lampe frontale, cyalumes (bâtons lumineux) pour la nuit", "ar": "قصبة سيرفكاستينغ 4.2–4.5 م (قوة 100–200 غ) · بكرة 5000–8000 ذات خزان كبير · خيط نايلون 0.30–0.35 أو مضفور 0.16–0.20 · خيط رأس 0.50–0.60 بطول حوالي 10 م · رصاص 80–150 غ، بمخالب إذا كان التيار قوياً · حامل قصبة للرمل، مصباح رأس، أعواد ضوئية لليل"}, "td.surfcasting.rig": {"fr": "Reliez le corps de ligne à l'arrache-plomb (nœud de raccord) | Préparez un bas de ligne de 1,2–1,5 m avec 1 ou 2 hameçons sur potences et émerillons | Fixez le plomb en bas du montage avec une agrafe | Eschez l'appât proprement et maintenez-le avec du fil élastique | Lancez derrière la 2ᵉ ou 3ᵉ vague, ou dans la cuvette près du bord si la mer est forte | Posez la canne sur le pique et gardez le fil légèrement tendu", "ar": "اربط الخيط الرئيسي بخيط الرأس (عقدة وصل) | جهّز خيطاً سفلياً بطول 1.2–1.5 م بصنارة أو اثنتين مع دوارات | ثبّت الرصاص أسفل التركيبة بمشبك | ضع الطعم جيداً وثبّته بخيط مطاطي | ارمِ خلف الموجة الثانية أو الثالثة، أو في الحفرة قرب الشاطئ إذا كان البحر قوياً | ضع القصبة على الحامل واترك الخيط مشدوداً قليلاً"}, "td.surfcasting.action": {"fr": "On n'anime pas : on surveille le scion. Ferrez sur une touche franche (le scion plonge ou se détend d'un coup). Relevez et changez l'appât toutes les 20 à 30 minutes, car il perd son odeur.", "ar": "لا نحرك الطعم: نراقب رأس القصبة. اجذب عند لمسة واضحة (ينحني الرأس أو يرتخي فجأة). ارفع الطعم وغيّره كل 20 إلى 30 دقيقة لأنه يفقد رائحته."}, "td.surfcasting.tips": {"fr": "Repérez les cuvettes et les baïnes à marée basse : les poissons y viennent manger à la marée montante · Pêchez avec 2 cannes, une loin et une près du bord · Après un coup de mer, l'eau un peu trouble est idéale pour le bar et la courbine", "ar": "حدّد الحفر والممرات عند الجزر: تأتي الأسماك إليها للأكل مع المد الصاعد · اصطد بقصبتين، واحدة بعيدة وأخرى قريبة من الشاطئ · بعد عاصفة بحرية، الماء العكر قليلاً مثالي للقاروص والكوربينا"}, "td.surfcasting.mistakes": {"fr": "Toujours lancer le plus loin possible : souvent le poisson est à 20–40 m · Garder un appât délavé trop longtemps · Fil trop détendu : on ne voit pas les touches", "ar": "الرمي دائماً لأبعد مسافة: غالباً تكون السمكة على بعد 20–40 م · ترك الطعم الباهت مدة طويلة · خيط مرتخٍ جداً: لا نرى اللمسات"}, "td.spinning.desc": {"fr": "Pêche active aux leurres artificiels : on lance puis on ramène le leurre en imitant un petit poisson. On se déplace pour prospecter rochers, pointes et digues.", "ar": "صيد نشيط بالطعوم الاصطناعية: نرمي ثم نسحب الطعم مقلدين سمكة صغيرة. نتنقل لاستكشاف الصخور والرؤوس والحواجز."}, "td.spinning.when": {"fr": "Aube et crépuscule, eau claire à légèrement trouble, mer de 0,2 à 1,5 m, vent de moins de 25 km/h. Idéal quand des poissons chassent en surface (oiseaux qui plongent, eau qui bouillonne).", "ar": "الفجر والغروب، ماء صافٍ إلى عكر قليلاً، بحر من 0.2 إلى 1.5 م، رياح أقل من 25 كم/س. مثالي عندما تطارد الأسماك على السطح (طيور تغطس، ماء يغلي)."}, "td.spinning.gear": {"fr": "Canne 2,7–3 m (10–40 g) · Moulinet 3000–4000 · Tresse 0,12–0,16 · Bas de ligne fluorocarbone 0,30–0,40, environ 1 m · Agrafe rapide sans émerillon · Leurres : poissons nageurs 12–14 cm, leurres souples avec têtes plombées 10–30 g, poppers et stickbaits, jigs métalliques 20–40 g", "ar": "قصبة 2.7–3 م (10–40 غ) · بكرة 3000–4000 · خيط مضفور 0.12–0.16 · خيط فلوروكربون 0.30–0.40 بطول حوالي 1 م · مشبك سريع بدون دوار · طعوم: سابحة 12–14 سم، لينة مع رؤوس رصاص 10–30 غ، طعوم سطحية، جيغ معدني 20–40 غ"}, "td.spinning.rig": {"fr": "Reliez la tresse au fluorocarbone avec un nœud FG ou Albright | Ajoutez une agrafe rapide au bout pour changer facilement de leurre | Choisissez le leurre selon la lumière, la mer et la clarté (voir les réglages du jour) | Lancez en éventail (gauche, centre, droite), puis avancez de 10–20 m", "ar": "اربط المضفور بالفلوروكربون بعقدة FG أو Albright | أضف مشبكاً سريعاً في الطرف لتغيير الطعم بسهولة | اختر الطعم حسب الضوء والبحر وصفاء الماء (انظر إعدادات اليوم) | ارمِ على شكل مروحة (يسار، وسط، يمين) ثم تقدّم 10–20 م"}, "td.spinning.action": {"fr": "Poisson nageur : récupération lente et régulière avec quelques arrêts. Leurre souple : récupération linéaire près du fond ou petites tirées. Popper ou stickbait : tirées rythmées en surface (zigzag). Jig : laissez couler puis remontez par tirées rapides.", "ar": "الطعم السابح: سحب بطيء ومنتظم مع توقفات. الطعم اللين: سحب مستقيم قرب القاع أو جذبات صغيرة. الطعم السطحي: جذبات منتظمة على السطح (حركة متعرجة). الجيغ: اتركه ينزل ثم اسحبه بجذبات سريعة."}, "td.spinning.tips": {"fr": "Commencez en surface à l'aube, puis pêchez plus profond quand le jour se lève · Pêchez l'écume et les courants autour des rochers · Changez de leurre si rien ne se passe après une dizaine de lancers", "ar": "ابدأ بالسطح عند الفجر ثم انزل أعمق مع طلوع النهار · اصطد في الزبد والتيارات حول الصخور · غيّر الطعم إذا لم يحدث شيء بعد عشر رميات تقريباً"}, "td.spinning.mistakes": {"fr": "Ramener trop vite · Rester toujours au même endroit · Bas de ligne trop court : la tresse s'use sur les rochers", "ar": "السحب بسرعة كبيرة · البقاء دائماً في نفس المكان · خيط فلورو قصير جداً: يتآكل المضفور على الصخور"}, "td.float.desc": {"fr": "Pêche fine avec un flotteur qui maintient l'appât à une profondeur réglée. Idéale le long des rochers et des digues.", "ar": "صيد دقيق بعوامة تُبقي الطعم على عمق محدد. مثالي بجانب الصخور والحواجز."}, "td.float.when": {"fr": "Mer calme à peu agitée (moins de 1 m), vent faible, eau claire. Possible toute la journée, mieux à l'aube et en fin d'après-midi.", "ar": "بحر هادئ إلى قليل الاضطراب (أقل من 1 م)، رياح ضعيفة، ماء صافٍ. ممكن طوال اليوم، والأفضل عند الفجر وآخر الظهيرة."}, "td.float.gear": {"fr": "Canne légère 4–5 m · Moulinet 2500–3000 · Nylon 0,20–0,22 · Bas de ligne 0,16–0,20 · Flotteur 2–8 g selon le vent · Olivette et petits plombs fendus · Hameçons fins n°8–12 · Amorce : sardine écrasée, pain, sable", "ar": "قصبة خفيفة 4–5 م · بكرة 2500–3000 · خيط نايلون 0.20–0.22 · خيط سفلي 0.16–0.20 · عوامة 2–8 غ حسب الريح · رصاصة زيتونية ورصاص صغير مشقوق · صنارات رفيعة رقم 8–12 · طُعم مجذب: سردين مهروس، خبز، رمل"}, "td.float.rig": {"fr": "Enfilez un stop-flotteur puis le flotteur coulissant sur le corps de ligne | Ajoutez une olivette sous le flotteur pour l'équilibrer : seule l'antenne doit dépasser | Placez un émerillon puis un bas de ligne de 50–80 cm | Réglez la profondeur : commencez à 1,5–3 m puis ajustez | Amorcez régulièrement par petites boulettes", "ar": "أدخل موقف العوامة ثم العوامة المنزلقة على الخيط الرئيسي | أضف رصاصة زيتونية تحت العوامة لموازنتها: يجب أن يظهر الهوائي فقط | ضع دواراً ثم خيطاً سفلياً بطول 50–80 سم | اضبط العمق: ابدأ بـ 1.5–3 م ثم عدّل | ألقِ الطُّعم المجذب بانتظام بكرات صغيرة"}, "td.float.action": {"fr": "Laissez dériver le flotteur dans le courant le long des rochers. Ferrez dès que le flotteur s'enfonce ou se couche. Relancez au même endroit et amorcez peu mais souvent.", "ar": "اترك العوامة تنجرف مع التيار بجانب الصخور. اجذب بمجرد أن تغطس العوامة أو تميل. أعد الرمي في نفس المكان وألقِ الطُّعم قليلاً لكن بشكل متكرر."}, "td.float.tips": {"fr": "Le sar aime l'écume : pêchez au bord des remous · Si les touches sont timides, affinez le bas de ligne et l'hameçon · Changez la profondeur jusqu'à trouver les poissons", "ar": "الشرغو يحب الزبد: اصطد عند حافة الدوامات · إذا كانت اللمسات خفيفة، استعمل خيطاً وصنارة أرفع · غيّر العمق حتى تجد الأسماك"}, "td.float.mistakes": {"fr": "Flotteur trop gros : le poisson sent la résistance · Trop amorcer : les poissons se gavent · Mauvaise profondeur : l'appât accroche le fond ou passe trop haut", "ar": "عوامة كبيرة جداً: تحس السمكة بالمقاومة · الإكثار من الطُّعم المجذب: تشبع الأسماك · عمق خاطئ: يعلق الطعم في القاع أو يمر عالياً جداً"}, "td.bottom.desc": {"fr": "Pêche au posé léger ou « au toc » près des rochers : l'appât reste sur le fond avec un plomb léger et on sent les touches à la main.", "ar": "صيد بالقاع الخفيف قرب الصخور: يبقى الطعم في القاع برصاص خفيف ونحس اللمسات باليد."}, "td.bottom.when": {"fr": "Mer peu agitée à agitée (0,2–1,6 m), eau légèrement trouble, marée montante. Fonctionne de jour comme de nuit.", "ar": "بحر قليل الاضطراب إلى مضطرب (0.2–1.6 م)، ماء عكر قليلاً، مد صاعد. يصلح نهاراً وليلاً."}, "td.bottom.gear": {"fr": "Canne 3–4 m (20–80 g) · Moulinet 3000–4000 · Nylon 0,25–0,30, ou tresse 0,12 avec fluoro 0,25–0,30 · Plomb coulissant ou olive 20–60 g · Hameçons forgés n°2–6 · Perles et émerillons", "ar": "قصبة 3–4 م (20–80 غ) · بكرة 3000–4000 · نايلون 0.25–0.30 أو مضفور 0.12 مع فلورو 0.25–0.30 · رصاص منزلق أو زيتوني 20–60 غ · صنارات قوية رقم 2–6 · خرزات ودوارات"}, "td.bottom.rig": {"fr": "Enfilez le plomb coulissant sur le corps de ligne | Ajoutez une perle pour protéger le nœud, puis un émerillon | Attachez un bas de ligne de 40–80 cm | Lancez près des rochers, dans les failles et les cassures | Gardez le fil tendu et la canne en main", "ar": "أدخل الرصاص المنزلق على الخيط الرئيسي | أضف خرزة لحماية العقدة ثم دواراً | اربط خيطاً سفلياً بطول 40–80 سم | ارمِ قرب الصخور وفي الشقوق والحواف | أبقِ الخيط مشدوداً والقصبة في يدك"}, "td.bottom.action": {"fr": "Laissez l'appât au fond et ramenez de quelques tours de temps en temps pour prospecter. À la touche (petits coups secs), laissez le poisson avaler 1 à 2 secondes puis ferrez.", "ar": "اترك الطعم في القاع واسحب بضع لفات من حين لآخر للاستكشاف. عند اللمسة (نقرات صغيرة)، اترك السمكة تبتلع ثانية أو ثانيتين ثم اجذب."}, "td.bottom.tips": {"fr": "Utilisez le plomb le plus léger possible selon le courant · Pêchez les failles et les cassures où l'eau tourne · Crabe et couteau sont excellents pour la dorade", "ar": "استعمل أخف رصاص ممكن حسب التيار · اصطد في الشقوق والحواف حيث يدور الماء · السلطعون وموس البحر ممتازان للدنيس"}, "td.bottom.mistakes": {"fr": "Plomb trop lourd, qui accroche · Ferrer trop tôt · Pêcher trop loin alors que le poisson est au pied des rochers", "ar": "رصاص ثقيل جداً يعلق · الجذب مبكراً · الصيد بعيداً بينما السمكة عند أسفل الصخور"}, "td.eging.desc": {"fr": "Pêche des calamars et des seiches avec des turluttes (egi), des leurres en forme de crevette munis de couronnes d'aiguilles.", "ar": "صيد الكلمار والسيبيا بالإيجي، وهي طعوم على شكل قمرون مزودة بتيجان من الإبر."}, "td.eging.when": {"fr": "Automne-hiver, de nuit (surtout en début de nuit), mer calme (moins de 0,8 m), eau claire, sous les lumières des digues où la pêche est autorisée.", "ar": "الخريف والشتاء، ليلاً (خاصة أول الليل)، بحر هادئ (أقل من 0.8 م)، ماء صافٍ، تحت أضواء الحواجز حيث يُسمح بالصيد."}, "td.eging.gear": {"fr": "Canne d'eging 2,4–2,7 m · Moulinet 2500–3000 · Tresse 0,08–0,12 · Fluoro 0,20–0,25, environ 1,5 m · Turluttes tailles 2.5 à 3.5, couleurs naturelles et fluo/UV · Épuisette ou gaffe à calamar", "ar": "قصبة إيجي 2.4–2.7 م · بكرة 2500–3000 · مضفور 0.08–0.12 · فلورو 0.20–0.25 بطول حوالي 1.5 م · إيجي مقاس 2.5 إلى 3.5 بألوان طبيعية وفسفورية · شبكة أو خطاف للكلمار"}, "td.eging.rig": {"fr": "Reliez la tresse au fluoro (nœud FG) | Attachez la turlutte avec une agrafe sans émerillon | Lancez et laissez couler la turlutte jusqu'au fond en comptant les secondes | Faites 2 ou 3 tirées sèches vers le haut | Laissez redescendre lentement, fil semi-tendu : c'est pendant la descente que le calamar attaque", "ar": "اربط المضفور بالفلورو (عقدة FG) | اربط الإيجي بمشبك بدون دوار | ارمِ واتركه ينزل إلى القاع مع عدّ الثواني | قم بجذبتين أو ثلاث قوية نحو الأعلى | اتركه ينزل ببطء والخيط نصف مشدود: الكلمار يهاجم أثناء النزول"}, "td.eging.action": {"fr": "Répétez tirées et descentes. Une touche se sent comme un poids ou un fil qui s'arrête : ferrez doucement et ramenez sans à-coups.", "ar": "كرّر الجذب والنزول. تُحس اللمسة كثقل أو خيط يتوقف: اجذب بلطف واسحب دون هزات."}, "td.eging.tips": {"fr": "Pleine lune ou eau claire : couleurs naturelles. Nuit noire ou eau trouble : fluo, UV ou phosphorescentes · Par vent fort, prenez une taille 3.5, plus stable", "ar": "بدر أو ماء صافٍ: ألوان طبيعية. ليلة مظلمة أو ماء عكر: فسفوري أو UV أو مضيء · مع ريح قوية، استعمل مقاس 3.5 لأنه أكثر ثباتاً"}, "td.eging.mistakes": {"fr": "Animer trop vite · Ramener avec des à-coups : le calamar se décroche · Pêcher en eau trouble", "ar": "التحريك بسرعة كبيرة · السحب بهزات: ينفلت الكلمار · الصيد في ماء عكر"}, "td.sabiki.desc": {"fr": "Ligne à plusieurs petits leurres plumes (mitraillette) pour prendre plusieurs maquereaux ou chinchards à la fois.", "ar": "خيط بعدة طعوم ريش صغيرة (السلسلة) لصيد عدة أسماك إسقمري أو شرن دفعة واحدة."}, "td.sabiki.when": {"fr": "Été et début d'automne, le matin et le soir, mer calme, depuis les digues et les pointes rocheuses. Repérez les bancs : oiseaux qui plongent, surface qui bouillonne.", "ar": "الصيف وبداية الخريف، صباحاً ومساءً، بحر هادئ، من الحواجز والرؤوس الصخرية. ابحث عن الأسراب: طيور تغطس، سطح يغلي."}, "td.sabiki.gear": {"fr": "Canne 3–4 m · Moulinet 3000–4000 · Nylon 0,25–0,30 · Mitraillette de 6 à 8 plumes, hameçons n°6–10 · Plomb 30–60 g · Seau", "ar": "قصبة 3–4 م · بكرة 3000–4000 · نايلون 0.25–0.30 · سلسلة من 6 إلى 8 ريشات، صنارات رقم 6–10 · رصاص 30–60 غ · دلو"}, "td.sabiki.rig": {"fr": "Attachez la mitraillette au corps de ligne | Fixez le plomb à l'agrafe du bas | Lancez vers le banc ou au large de la digue | Laissez couler à la profondeur voulue", "ar": "اربط السلسلة بالخيط الرئيسي | ثبّت الرصاص في المشبك السفلي | ارمِ نحو السرب أو بعيداً عن الحاجز | اتركها تنزل إلى العمق المطلوب"}, "td.sabiki.action": {"fr": "Faites de grandes tirées verticales puis laissez retomber. Quand ça mord, attendez quelques secondes pour remplir les autres hameçons, puis remontez régulièrement.", "ar": "قم بجذبات عمودية كبيرة ثم اتركها تنزل. عندما تعض السمكة، انتظر بضع ثوانٍ لتمتلئ الصنارات الأخرى ثم اسحب بانتظام."}, "td.sabiki.tips": {"fr": "Si les poissons boudent, ajoutez une lanière de sardine sur les hameçons · Le maquereau est un excellent appât, vivant ou en lanière, pour le bar, la liche et la courbine", "ar": "إذا لم تعض الأسماك، أضف شريحة سردين على الصنارات · الإسقمري طعم ممتاز، حياً أو شرائح، للقاروص والليشة والكوربينا"}, "td.sabiki.mistakes": {"fr": "Garder plus de poissons que nécessaire · Laisser traîner les hameçons, dangereux pour les autres", "ar": "الاحتفاظ بأسماك أكثر من الحاجة · ترك الصنارات مرمية، خطر على الآخ async function fetchMarineSingle(s) {

    M.time.forEach((tm, i) => mar[tm] = {
      wave: g('wave_height', i), wdir: g('wave_direction', i), wper: g('wave_period', i),
      wwH: g('wind_wave_height', i), wwDir: g('wind_wave_direction', i), wwPer: g('wind_wave_period', i),
      swH: g('swell_wave_height', i), swDir: g('swell_wave_direction', i), swPer: g('swell_wave_period', i),
      sea: g('sea_surface_temperature', i), cur: g('ocean_current_velocity', i), curDir: g('ocean_current_direction', i), sl: g('sea_level_height_msl', i)});
  }

    pprob: H.precipitation_probability[i], precip: H.precipitation[i], pres: H.pressure_msl[i], cloud: H.cloud_cover[i], vis: H.visibility ? H.visibility[i] : null,
  }, mar[tm] || {}));

async function fetchSingle(s) {

// Chargement groupé : 2 requêtes pour 25 spots
async function fetchBatch(spots) {

    getJSON(`https://api.open-meteo.com/v1/forecast?${coords(spots.map(s => [s.lat, s.lon]))}&${COMMON}&wind_speed_unit=kmh&daily=sunrise,sunset&hourly=${FC_VARS}`).then(asList),
    getJSON(`https://marine-api.open-meteo.com/v1/marine?${coords(spots.map(s => s.sea || [s.lat, s.lon]))}&${COMMON}&hourly=${MARINE_VARS}`).then(asList).catch(() => [])]);

function analyzeTide(hours) {
  const raw = [];
  for (let i = 1; i < hours.length - 1; i++) {
    const a = hours[i - 1].sl, b = hours[i].sl, c = hours[i + 1].sl;
    if (a == null || b == null || c == null) continue;
    if (b > a && b >= c) raw.push({type: 'high', date: hours[i].date, h: b});
    else if (b < a && b <= c) raw.push({type: 'low', date: hours[i].date, h: b});
  }
  const ext = [];
  for (const e of raw) {
    const last = ext[ext.length - 1];
    if (last && last.type === e.type) { if ((e.type === 'high') === (e.h > last.h)) ext[ext.length - 1] = e; continue; }
    if (last && Math.abs(e.h - last.h) < 0.04) continue;
    ext.push(e);
  }
  const ranges = []; for (let k = 1; k < ext.length; k++) ranges.push(Math.abs(ext[k].h - ext[k - 1].h));
  const med = ranges.length ? ranges.slice().sort((a, b) => a - b)[Math.floor(ranges.length / 2)] : 0;
  hours.forEach(h => {
    let prev = null; for (const e of ext) if (e.date <= h.date) prev = e;
    const next = ext.find(e => e.date > h.date);
    if (!prev || !next) { h.tide = null; return; }
    const frac = (h.date - prev.date) / (next.date - prev.date), range = Math.abs(next.h - prev.h);
    h.tide = {rising: next.type === 'high', frac, range, slack: frac < 0.12 || frac > 0.88, big: med > 0 && range > med * 1.15};
  });
  return {extremes: ext, medianRange: med, available: ext.length >= 2};
}

const RAD = Math.PI / 180, OBL = RAD * 23.4397;

function moonAlt(ms, lat, lon) {

  const l = L + RAD * 6.289 * Math.sin(M), b = RAD * 5.128 * Math.sin(F);
  const ra = Math.atan2(Math.sin(l) * Math.cos(OBL) - Math.tan(b) * Math.sin(OBL), Math.cos(l));
  const dec = Math.asin(Math.sin(b) * Math.cos(OBL) + Math.cos(b) * Math.sin(OBL) * Math.sin(l));

function solunar(lat, lon, start, end) {

    if (p1 > p2 && p1 >= a) majors.push({date: new Date(x - step), up: true});
    if (p1 < p2 && p1 <= a) majors.push({date: new Date(x - step), up: false});
    if ((p1 - h0) * (a - h0) < 0) minors.push({date: new Date(x - step + step * (h0 - p1) / (a - p1)), rise: a > p1});
    p2 = p1; p1 = a;
  }

const SYN = 29.530588853, REF = Date.UTC(2000, 0, 6, 18, 14);
function moonPhase(d) { let p = ((d - REF) / 864e5 % SYN) / SYN; return p < 0 ? p + 1 : p; }
function moonIllum(d) { return (1 - Math.cos(2 * Math.PI * moonPhase(d))) / 2; }
function moonInfo(d) {

}

function scoreHours(hours, sun, spot, sol) {

    let s = 50; const f = []; const add = (v, key, pos) => { s += v; f.push({key, pos}); };

      if (h.wind < 10) add(15, 'f.wind.calm', 1); else if (h.wind < 20) add(8, 'f.wind.light', 1);
      else if (h.wind < 30) add(-5, 'f.wind.moderate', 0); else if (h.wind < 40) add(-20, 'f.wind.strong', 0); else add(-40, 'f.wind.veryStrong', 0);
    }

      if (angDiff(h.dir, spot.face) < 60) add(-10, 'f.wind.onshore', 0);

      else if (h.wave >= 0.5) add(spot.type === 'jetty' ? 5 : 15, 'f.waves.ideal', 1); else add(5, 'f.waves.calm', 1);

function windows(hours, within = 72) {

  for (const h of hours) {

  if (h.sol === 'major') out.push('ctx.solunar');
  if (h.tod === 'night' && spotSpecies(spot).includes('squid')) out.push('ctx.night');
  if (spotSpecies(spot).includes('meagre') && (h.tod !== 'day') && c.wave >= 0.5) out.push('ctx.meagre');
  if (has('f.cloudy')) out.push('ctx.cloudy');
  if (has('f.light.harsh')) out.push('ctx.sunny');
  if (c.sea != null && c.sea < 15) out.push('ctx.coldWater');
  if (!out.length) out.push('ctx.default');
  return out;
}

// ================= Formatage =================
const loc = () => lang === 'ar' ? 'ar-MA' : 'fr-FR';
const fmtTime = d => d.toLocaleTimeString(loc(), {hour: '2-digit', minute: '2-digit', hour12: false});
function fmtDay(d) {
  const a = new Date(); a.setHours(0, 0, 0, 0); const b = new Date(d); b.setHours(0, 0, 0, 0);
  const diff = Math.round((b - a) / 864e5);
  if (diff === 0) return t('day.today'); if (diff === 1) return t('day.tomorrow');
  return d.toLocaleDateString(loc(), {weekday: 'long', day: 'numeric', month: 'short'});
}
const fmtRange = w => `${fmtDay(w.start)} · ${fmtTime(w.start)} – ${fmtTime(w.end)}`;
const fmtAt = d => `${fmtDay(d)} · ${fmtTime(d)}`;
const num = (v, u, dg = 0) => v == null ? '—' : `${(+v).toFixed(dg)} ${u}`;
const cardinal = d => d == null ? '' : t('dir.' + ['N','NE','E','SE','S','SW','W','NW'][Math.round(((d % 360) / 45)) % 8]);
const arrow = d => d == null ? '' : `<span style="display:inline-block;transform:rotate(${d}deg)">⬇︎</span>`;
const pct = p => `${Math.round(p * 100)} %`;
const pcol = p => p == null ? '#9ca3af' : p >= 0.6 ? '#16a34a' : p >= 0.35 ? '#ea8a0c' : '#dc2626';
const pcls = p => p == null ? 'n' : p >= 0.6 ? 'g' : p >= 0.35 ? 'o' : 'r';
const cls = s => s == null ? 'n' : s >= 65 ? 'g' : s >= 45 ? 'o' : 'r';
const color = s => s == null ? '#9ca3af' : s >= 65 ? '#16a34a' : s >= 45 ? '#ea8a0c' : '#dc2626';
const labelKey = s => s >= 65 ? 'score.good' : s >= 45 ? 'score.medium' : 'score.bad';
const badge = s => `<span class="badge ${cls(s)}">${s}/100</span>`;
const pbadge = p => `<span class="badge ${pcls(p)}">🎣 ${pct(p)}</span>`;
let myPos = null;
const distKm = (s) => { if (!myPos) return null; const dLat = (s.lat - myPos[0]) * RAD, dLon = (s.lon - myPos[1]) * RAD;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(myPos[0] * RAD) * Math.cos(s.lat * RAD) * Math.sin(dLon / 2) ** 2; return 12742 * Math.asin(Math.sqrt(a)); };

let map, markers = {}, addMode = false;
function initMap() {
  map = L.map('map', {zoomControl: false}).setView([30.0, -9.0], 5);

  ZONES.forEach(z => L.circle([z.lat, z.lon], {radius: z.r, color: '#dc2626', weight: 1.5, fillOpacity: 0.18})
    .addTo(map).bindTooltip(() => '⛔ ' + t('map.restricted')));

}
function renderMarkers() {
  if (!map) return;

  const small = map.getZoom() <= 6;
  allSpots().forEach(s => {
    const h = currentHour(s), p = h ? h.total : null;

}
function flyRegion(r, animate = true) {

  if (!pts.length) return;

// ================= Graphiques SVG =================
function lineChart(hours, series, opts = {}) {
  const W = 340, Hh = opts.h || 140, pad = 26, n = hours.length; if (n < 2) return '';
  const x0 = +hours[0].c.date, x1 = +hours[n - 1].c.date, X = d => pad + (W - pad - 6) * (d - x0) / (x1 - x0);
  const lo = opts.min ?? 0, hi = opts.max ?? 100, Y = v => 8 + (Hh - 30) * (1 - (v - lo) / (hi - lo || 1));
  let g = '';
  hours.forEach(h => { if (h.c.date.getHours() === 0) g += `<line x1="${X(+h.c.date)}" x2="${X(+h.c.date)}" y1="8" y2="${Hh - 22}" stroke="#8884"/><text x="${X(+h.c.date) + 3}" y="${Hh - 8}">${h.c.date.toLocaleDateString(loc(), {weekday: 'short'})}</text>`; });
  (opts.labels || []).forEach(v => g += `<text x="0" y="${Y(v) + 4}">${v}</text>`);
  if (opts.ref != null) g += `<line x1="${pad}" x2="${W}" y1="${Y(opts.ref)}" y2="${Y(opts.ref)}" stroke="#ea8a0c" stroke-dasharray="4"/>`;
  (opts.bands || []).forEach(b => { const a = Math.max(x0, b.from), z = Math.min(x1, b.to); if (z > a) g += `<rect x="${X(a)}" y="8" width="${X(z) - X(a)}" height="${Hh - 30}" fill="${b.color}" fill-opacity=".12"/>`; });
  series.forEach(sr => {
    const pts = hours.filter(h => sr.get(h) != null).map(h => `${X(+h.c.date).toFixed(1)},${Y(sr.get(h)).toFixed(1)}`);
    if (pts.length < 2) return;
    if (sr.fill) g += `<polygon points="${X(x0)},${Y(lo)} ${pts.join(' ')} ${X(x1)},${Y(lo)}" fill="${sr.color}" fill-opacity=".15"/>`;
    g += `<polyline points="${pts.join(' ')}" fill="none" stroke="${sr.color}" stroke-width="2" ${sr.dash ? 'stroke-dasharray="4 3"' : ''}/>`;
  });
  (opts.marks || []).forEach(m => { const x = X(+m.date); if (x >= pad && x <= W) g += `<circle cx="${x}" cy="${Y(m.v)}" r="3" fill="${m.color}"/><text x="${x - 12}" y="${m.type === 'high' ? Y(m.v) - 6 : Y(m.v) + 14}">${fmtTime(m.date)}</text>`; });
  const now = Date.now(); if (now >= x0 && now <= x1) g += `<line x1="${X(now)}" x2="${X(now)}" y1="8" y2="${Hh - 22}" stroke="#888" stroke-width="1.5"/>`;
  const leg = series.filter(s => s.label).map(s => `<span style="margin-inline-end:12px"><i class="dot" style="background:${s.color}"></i>${s.label}</span>`).join('') + (opts.bandLabel || '');
  return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" dir="ltr">${g}</svg>${leg ? `<div class="sub">${leg}</div>` : ''}`;
}

    const s = {id: 'c' + Date.now(), name: {fr: name, ar: name}, lat: c.lat, lon: c.lng, custom: true, region: 'custom', face: coast === 'mediterranean' ? 0 : 285,
      type: document.getElementById('a-type').value, coast,
      species: [...document.querySelectorAll('#addform input[type=checkbox]:checked')].map(x => x.value)};
    custom.push(s); LS.set('customSpots', custom); closeAdd(); setAddMode(false); renderRegionSel(); refreshAll(); loadSpot(s);
  });
}
function closeAdd() { document.getElementById('addsheet').classList.remove('open'); }
const TYPES = ['rocks','beach','jetty','estuary'];
const COASTS = ['atlantic','mediterranean'];
const TYPE_ICON = {rocks:'🪨', beach:'🏖️', jetty:'🛤️', estuary:'🌊'};

// ================= Onglets =================
const TABS = [['map', '🗺️', 'tab.map'], ['when', '🕒', 'tab.when'], ['tips', '💡', 'tab.tips'], ['settings', '⚙️', 'tab.settings']];
let tab = 'map';
function renderTabs() {
  document.getElementById('tabs').innerHTML = TABS.map(([id, ic, k]) => `<button class="${tab === id ? 'active' : ''}" onclick="go('${id}')"><span>${ic}</span>${t(k)}</button>`).join('');
}
function go(id) {
  tab = id; document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + id));
  renderTabs(); if (id === 'map') setTimeout(() => map.invalidateSize(), 50);
}
let sortMode = 'chance';
function spotRow(s, b, now, topSp, sp) {
  const dk = distKm(s), p = b ? (sp ? b.chances[sp] : b.total) : null;
  return `<div class="row" onclick="openSpot('${s.id}')" style="cursor:pointer">
    <div class="grow"><div>${favs.includes(s.id) ? '❤️ ' : ''}${esc(spotName(s))}</div>
    <div class="sub">${b ? `${t('best.peak')} ${fmtAt(b.c.date)} · ${SP_ICON[sp || topSp]} ${t('species.' + (sp || topSp))}` : t(errors[s.id] ? 'detail.error' : 'detail.loading')}</div>
    ${now ? `<div class="sub">${t('best.now')} : ${pct(sp ? now.chances[sp] : now.total)}${now.c.wave != null ? ' · 🌊 ' + now.c.wave.toFixed(1) + ' m' : ''}${now.c.wind != null ? ' · 💨 ' + Math.round(now.c.wind) + ' km/h' : ''}${dk != null ? ' · 📍 ' + Math.round(dk) + ' km' : ''}</div>` : ''}</div>
    ${p != null ? pbadge(p) : ''}<span class="sub">›</span></div>`;
}
function renderWhen() {
  const sp = speciesFilter === 'all' ? null : speciesFilter;
  const pool = allSpots().filter(s => (regionFilter === 'all' || s.region === regionFilter) && (!sp || spotSpecies(s).includes(sp)));
  const val = r => r.b ? (sp ? r.b.chances[sp] : r.b.total) : -1;
  const rows = pool.map(s => { const fh = futureHours(s, 48); const b = bestHour(fh, x => sp ? x.chances[sp] : x.total);
      const topSp = b ? spotSpecies(s).slice().sort((x, y) => b.chances[y] - b.chances[x])[0] : null; return {s, b, now: fh[0], topSp}; });
  rows.sort(sortMode === 'near' && myPos ? (a, b) => distKm(a.s) - distKm(b.s) : (a, b) => val(b) - val(a));
  let html = `<div class="filters"><select id="f-region">${regionOptions(regionFilter)}</select>
    <select id="f-species"><option value="all">${t('filter.allSpecies')}</option>${SPECIES.map(x => `<option value="${x}" ${speciesFilter === x ? 'selected' : ''}>${SP_ICON[x]} ${t('species.' + x)}</option>`).join('')}</select></div>
    <div class="seg" style="margin-bottom:12px"><button class="${sortMode === 'chance' ? 'on' : ''}" onclick="setSort('chance')">🎣 ${t('sort.chance')}</button>
    <button class="${sortMode === 'near' ? 'on' : ''}" onclick="setSort('near')">📍 ${t('sort.near')}</button></div>`;
  if (regionFilter === 'all') html += zoneCard(sp);
  else html += `<button class="btn sec" style="margin-bottom:12px" onclick="regionFilter='all';LS.set('region','all');renderRegionSel();renderWhen()">🧭 ${t('zone.seeAll')}</button>`;
  html += bestDayCard(pool, sp);
  const top = rows.slice().sort((a, b) => val(b) - val(a))[0];
  if (top && top.b) html += `<div class="card" onclick="openSpot('${top.s.id}')" style="cursor:pointer"><h3>🏆 ${t('best.top')} · ${regionFilter === 'all' ? t('filter.all') : regionName(regionFilter)}</h3>
    <div style="font-size:20px;font-weight:700">${esc(spotName(top.s))}</div><div class="sub">${regionName(top.s.region)}</div>
    <div style="margin:6px 0">🕒 ${fmtAt(top.b.c.date)} · ${SP_ICON[sp || top.topSp]} ${t('species.' + (sp || top.topSp))}</div>
    <div class="big" style="color:${pcol(val(top))}">${pct(val(top))}</div><div class="sub">${t(sp ? 'chance.species' : 'chance.total')}</div></div>`;
  const favRows = rows.filter(r => favs.includes(r.s.id));
  if (favRows.length) html += `<div class="card"><h3>❤️ ${t('fav.title')}</h3>${favRows.map(r => spotRow(r.s, r.b, r.now, r.topSp, sp)).join('')}</div>`;
  html += `<div class="card"><h3>${t('best.ranking')} (${rows.length})</h3>${rows.map(r => spotRow(r.s, r.b, r.now, r.topSp, sp)).join('') || `<div class="sub">${t('filter.none')}</div>`}</div>`;
  if (!sp) html += `<div class="card"><h3>${t('best.bySpecies')}</h3>${SPECIES.map(x => {
    let best = null;
    pool.forEach(s => { if (!spotSpecies(s).includes(x)) return; const b = bestHour(futureHours(s, 48), h => h.chances[x]); if (b && (!best || b.chances[x] > best.p)) best = {s, h: b, p: b.chances[x]}; });
    return best ? `<div class="row" onclick="openSpot('${best.s.id}')" style="cursor:pointer"><span style="font-size:20px">${SP_ICON[x]}</span>
      <div class="grow"><div><b>${t('species.' + x)}</b> — ${esc(spotName(best.s))}</div><div class="sub">${fmtAt(best.h.c.date)}</div></div>${pbadge(best.p)}</div>` : ''; }).join('')}</div>`;
  html += `<div class="sub" style="padding:0 6px">${lastUpdate ? t('best.updated') + ' ' + fmtTime(lastUpdate) + '. ' : ''}${t('chance.note')} ${t('best.footer')}</div>`;
  const v = document.getElementById('view-when'), y = v.scrollTop;
  v.innerHTML = html; v.scrollTop = y;
  const fr = document.getElementById('f-region'), fs = document.getElementById('f-species');
  if (fr) fr.onchange = () => { regionFilter = fr.value; LS.set('region', regionFilter); renderRegionSel(); flyRegion(regionFilter, false); renderWhen(); };
  if (fs) fs.onchange = () => { speciesFilter = fs.value; renderWhen(); };
}
function setSort(m) {
  sortMode = m;
  if (m === 'near' && !myPos) { locate(false); }
  renderWhen();
}
function renderTips() {
  document.getElementById('view-tips').innerHTML = `
    <div class="card"><h3>${t('tips.reading.title')}</h3>${t('tips.reading.text')}<p>${t('tips.chance.text')}</p></div>
    <div class="card"><h3>🌊 ${t('tips.sea.title')}</h3>${t('tips.sea.text')}</div>
    <div class="card"><h3>🌙 ${t('tips.solunar.title')}</h3>${t('tips.solunar.text')}</div>
    <div class="card"><h3>🎣 ${t('techs.all')}</h3>${Object.keys(TECH).map(k => `<div class="row">${techName(k)}</div>`).join('')}<div class="sub">${t('techs.tap')}</div></div>
    <div class="card"><h3>${t('tips.species.title')}</h3>${SPECIES.map(x => `<details><summary>${SP_ICON[x]} ${t('species.' + x)}</summary><p>${t('tip.' + x)}</p></details>`).join('')}</div>
    <div class="card"><h3>🧭 ${t('tips.regions.title')}</h3>${t('tips.regions.text')}</div>
    <div class="card"><h3>🌬️ ${t('tips.wind.title')}</h3>${t('tips.wind.text')}</div>
    <div class="card"><h3>🎣 ${t('tips.gear.title')}</h3>${t('tips.gear.text')}</div>
    <div class="card"><h3>🦺 ${t('tips.safety.title')}</h3>${t('tips.safety.text')}</div>
    <div class="card"><h3>📜 ${t('tips.rules.title')}</h3>${t('tips.rules.text')}</div>`;
}
function renderSettings() {
  document.getElementById('view-settings').innerHTML = `
    <div class="card"><h3>${t('settings.language')}</h3><div class="seg">
      <button class="${lang === 'fr' ? 'on' : ''}" onclick="setLang('fr')">Français</button>
      <button class="${lang === 'ar' ? 'on' : ''}" onclick="setLang('ar')">العربية</button></div></div>
    <div class="card"><h3>📲 ${t('install.title')}</h3>${t('install.text')}</div>
    <div class="card"><h3>${t('settings.about')}</h3><p>${t('settings.aboutText')}</p><p class="sub">${allSpots().length} spots · ${Object.keys(REGIONS).length} ${t('settings.regions')}</p><p class="sub">${t('settings.data')}</p><p class="sub">${t('settings.disclaimer')}</p></div>
    ${custom.length ? `<button class="btn del" onclick="resetCustom()">${t('settings.resetCustom')}</button>` : ''}`;
}
function resetCustom() { custom = []; LS.set('customSpots', custom); if (regionFilter === 'custom') regionFilter = 'all'; renderRegionSel(); refreshAll(); }
function setLang(l) {
  lang = l; LS.set('lang', l);
  document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('langbtn').textContent = l === 'ar' ? 'FR' : 'ع';
  document.getElementById('title').textContent = '🎣 ' + (l === 'ar' ? 'صيد المغرب' : 'Pêche Maroc');
  renderLegend(); renderRegionSel(); setAddMode(addMode); refreshAll();
}
function refreshAll() { renderMarkers(); renderTabs(); renderWhen(); renderTips(); renderSettings(); renderSheet(); }

// ================= Position =================
let meMarker;
function locate(center = true) {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    myPos = [p.coords.latitude, p.coords.longitude];
    if (map) { if (meMarker) meMarker.remove();
      meMarker = L.circleMarker(myPos, {radius: 8, color: '#fff', weight: 3, fillColor: '#2563eb', fillOpacity: 1}).addTo(map);
      if (center) map.setView(myPos, 10); }
    refreshAll();
  }, () => {}, {enableHighAccuracy: true, timeout: 10000});
}

// ================= Démarrage =================
initMap();
setLang(lang);
document.getElementById('langbtn').onclick = () => setLang(lang === 'ar' ? 'fr' : 'ar');
document.getElementById('refresh').onclick = () => loadAll(true);
document.getElementById('addbtn').onclick = () => setAddMode(!addMode);
document.getElementById('locate').onclick = () => locate(true);
loadAll();
setInterval(() => loadAll(), 30 * 60 * 1000);
</script>
</body>
</html>
